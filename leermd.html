  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b1020;
      color: #e7ecff;
      overflow: hidden;
      height: 100vh;
    }

    /* Layout con Grid */
    .container {
      display: grid;
      grid-template-rows: 1fr;
      grid-template-columns: 1fr auto;
      height: 100vh;
    }
    
    main {
      grid-column: 1;
      grid-row: 1;
      overflow-y: auto;
      padding: 30px;
      background: #0b1020;
    }

    main.full-width {
      grid-column: 1 / -1;
    }

    /* Botón hamburguesa */
    .menu-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: #2aebad;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 1000;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(42, 235, 173, 0.3);
    }

    .menu-btn:hover {
      background: #21c08d;
      transform: scale(1.05);
    }

    .menu-btn span {
      width: 28px;
      height: 3px;
      background: #032217;
      border-radius: 2px;
      transition: all 0.3s;
    }

    /* Menú desplegable */
    .menu-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #141a2a;
      border: 2px solid #27304a;
      border-radius: 12px;
      padding: 15px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 1001;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      min-width: 180px;
    }

    .menu-panel.visible {
      display: flex;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .menu-close-btn {
      width: 100%;
      padding: 12px;
      background: #2aebad;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
      color: #032217;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .menu-close-btn:hover {
      background: #21c08d;
      transform: translateY(-1px);
    }

    .btn-fullscreen {
      width: 100%;
      padding: 12px;
      background: #2a5f8a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #e7ecff;
      transition: all 0.2s;
    }

    .btn-fullscreen:hover {
      background: #3a7faa;
      transform: translateY(-1px);
    }

    .btn-tornar {
      width: 100%;
      padding: 12px;
      background: #27304a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #e7ecff;
      transition: all 0.2s;
    }

    .btn-tornar:hover {
      background: #3a4a6a;
      transform: translateY(-1px);
    }

    .btn-pausar-md {
      width: 100%;
      padding: 12px;
      background: #e63946;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      transition: all 0.2s;
    }

    .btn-pausar-md:hover {
      background: #ff5566;
      transform: translateY(-1px);
    }

    /* Indicador de continuar */
    .continue-indicator-md {
      background: #e63946;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.4);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .continue-indicator-md::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid #e63946;
    }

    .continue-indicator-md .fecha {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .menu-separator {
      height: 1px;
      background: #27304a;
      margin: 5px 0;
    }

    .font-size-controls {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-font {
      flex: 1;
      padding: 12px;
      background: #27304a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      color: #e7ecff;
      transition: all 0.2s;
    }

    .btn-font:hover {
      background: #3a4a6a;
      transform: translateY(-1px);
    }

    /* Label del fichero */
    .info-label {
      position: fixed;
      top: 20px;

      z-index: 999;
      background: #27304a;
      color: #e7ecff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      opacity: 0.9;
    }

    #content {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.7;
      font-size: 16px;
      transition: font-size 0.2s;
    }
    
    /* Markdown styling */
    #content h1,
    #content h2,
    #content h3,
    #content h4,
    #content h5,
    #content h6 {
      color: #6ae0a7;
      margin-top: 1em;
      margin-bottom: 0.5em;
      font-weight: bold;
      line-height: 1.3;

    #content h1 {
      font-size: 2.2em;
      border-bottom: 3px solid #27304a;
      padding-bottom: 0.3em;
    }

    #content h2 {
      font-size: 1.8em;
      border-bottom: 2px solid #27304a;
      padding-bottom: 0.25em;
    }

    #content h3 {
      font-size: 1.5em;
    }

    #content h4 {
      font-size: 1.3em;
    }

    #content h5 {
      font-size: 1.1em;
    }

    #content h6 {

      color: #a0a8c0;
    }

    #content p {
      margin-bottom: 1.2em;
    }

    #content ul,
    #content ol {

      padding-left: 2em;
    }

    #content li {
      margin-bottom: 0.5em;
    }
    
    #content code { 
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: #1b223a;
      color: #2aebad;

    }

      background: #141a2a;

      margin: 1em 0;
      padding: 12px 20px;
      background: #141a2a;
      border-radius: 0 8px 8px 0;
      margin-bottom: 1.5em;
    }

    #content blockquote p:last-child {
      margin-bottom: 0;
    }

    .markdown-alert {
      margin: 1.5em 0;
      padding: 14px 18px;
      border: 1px solid #27304a;
      border-left-width: 5px;
      border-radius: 10px;
      background: #141a2a;

    .markdown-alert-title {
      margin-bottom: 0.7em;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;

    .markdown-alert p:last-child,
    .markdown-alert ul:last-child,
    .markdown-alert ol:last-child,
    .markdown-alert pre:last-child {

    }

    .markdown-alert-note {
      border-left-color: #4cb3ff;
      background: #111d31;
    }

      color: #7bc7ff;
    }

    .markdown-alert-tip {
      border-left-color: #2aebad;
      background: #10241f;
    }

    .markdown-alert-tip .markdown-alert-title {
      color: #6ae0a7;
    }

    .markdown-alert-important {
      border-left-color: #b68cff;
      background: #1a1630;
    }

    .markdown-alert-important .markdown-alert-title {
      color: #d0b3ff;
    }

    .markdown-alert-warning {
      border-left-color: #f2b84b;
      background: #2c2110;
    }

    .markdown-alert-warning .markdown-alert-title {
      color: #ffd37a;
    }

    .markdown-alert-caution {
      border-left-color: #ff6b81;
      background: #2d1419;
    }

    .markdown-alert-caution .markdown-alert-title {
      color: #ff9eac;
    }
    
    #content table {
      border-collapse: collapse;
      overflow: auto;
      background: #141a2a;
      border-radius: 8px;
      margin-bottom: 1.5em;
    }
    
    #content th, #content td {
      border: 1px solid #27304a;
      padding: 10px 12px;
      vertical-align: top;
      border-top: 1px solid #27304a;
    }
    
    #content th {
      background: #27304a;
      color: #6ae0a7;
      padding: 12px;
      text-align: left;
      font-weight: bold;
    }

    #content tr:hover {
      background: #1b223a;
    }

    #content a {
      color: #6ae0a7;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    #content a:hover {
      border-bottom-color: #6ae0a7;
    }

    #content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1em 0;
    }

    .embedded-image-warning {
      margin: 1em 0;
      padding: 14px 16px;
      border: 1px solid #5a3940;
      border-left: 5px solid #ff6b81;
      border-radius: 10px;
      background: #241218;
      color: #ffd6dc;
    }

    .embedded-image-warning strong {
      color: #ff9eac;
    }

    #content hr {
      border: none;
      border-top: 2px solid #27304a;
      margin: 2em 0;
      border-left: 4px solid #6ae0a7;
      background: #141a2a;
      border-radius: 8px;
    }
    
    /* Mermaid container spacing */
    .mermaid {
      margin: 1.5em 0;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #27304a;
      background: #141a2a;
      display: flex;
      justify-content: center;
      min-height: 200px;
    }

    .mermaid svg {
      max-width: 100% !important;
      height: auto !important;
      min-width: 400px;
    }

    /* Panel TOC */
    .toc-panel {
      grid-column: 2;
      grid-row: 1;
      width: 280px;
      background: #141a2a;
      border-left: 2px solid #27304a;
      overflow-y: auto;
      padding: 10px;
    }

    .toc-panel.hidden {
      display: none;
    }

    .toc-title {
      color: #6ae0a7;
      font-size: 1.2rem;
      font-weight: bold;

      padding-bottom: 10px;

    }

    .toc-list {

    }

    .toc-link {
      color: #a0a8c0;
      text-decoration: none;
      display: block;
      padding: 2px 10px;
      border-radius: 6px;
      transition: all 0.2s;
      font-size: 0.95rem;

    .toc-link:hover {

      color: #6ae0a7;
    }

    .toc-link.active {

      color: #fff;
      font-weight: 600;
    }

    .toc-item.level-1 { padding-left: 0; }
    .toc-item.level-2 { padding-left: 15px; }
    .toc-item.level-3 { padding-left: 30px; }
    .toc-item.level-4 { padding-left: 45px; }
    .toc-item.level-5 { padding-left: 60px; }
    .toc-item.level-6 { padding-left: 75px; }

    /* Scrollbars */
    main::-webkit-scrollbar,
    .toc-panel::-webkit-scrollbar {
      width: 10px;
    }

    main::-webkit-scrollbar-track,
    .toc-panel::-webkit-scrollbar-track {
      background: #0b1020;
    }

    main::-webkit-scrollbar-thumb,
    .toc-panel::-webkit-scrollbar-thumb {
      background: #27304a;
      border-radius: 5px;
    }

    main::-webkit-scrollbar-thumb:hover,
    .toc-panel::-webkit-scrollbar-thumb:hover {
      background: #3a4a6a;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .menu-btn {
        width: 45px;
        height: 45px;
        top: 15px;
        right: 15px;
      }

      .menu-btn span {
        width: 24px;
      }

      .menu-panel {
        top: 15px;
        right: 15px;
        min-width: 150px;
      }
    }
  </style>

<body>

  <!-- Botón hamburguesa -->
  <button class="menu-btn" id="menuBtn">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Menú desplegable -->
  <div class="menu-panel" id="menuPanel">
    <button class="menu-close-btn" id="menuCloseBtn">

    </button>

    </button>

    </button>

    </button>
  </div>

  <!-- Label fijo arriba a la izquierda con el nombre del fichero -->
  <div id="infoLabel" class="info-label"></div>

  <div class="container">
    <main id="mainPanel">
      <div id="content"></div>
    </main>

    <div class="toc-panel" id="tocPanel">
      <div class="toc-title">📑 Índex</div>
      <ul class="toc-list" id="tocList"></ul>
    </div>
  </div>

  <script src="assets/js/toast.js"></script>
  <script src="assets/js/localstorage-utils.js"></script>
  <script>
    // 1) Configura Mermaid (NO auto-start; lo hacemos tras insertar el HTML)
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "loose"
    });

    // 2) Configura Marked
    marked.setOptions({
      gfm: true,
      breaks: false,
      headerIds: true,
      mangle: false
    });

    // Variables globales
    let tocVisible = true;
    let currentFontSize = 16;
    const minFontSize = 10;
    const maxFontSize = 30;
    const mainPanel = document.getElementById('mainPanel');
    const tocPanel = document.getElementById('tocPanel');
    const tocList = document.getElementById('tocList');
    const contentDiv = document.getElementById('content');
    const infoLabel = document.getElementById('infoLabel');
    const menuBtn = document.getElementById('menuBtn');
    const menuPanel = document.getElementById('menuPanel');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const tornarBtn = document.getElementById('tornarBtn');
    const btnToggleToc = document.getElementById('btnToggleToc');
    const btnFontIncrease = document.getElementById('btnFontIncrease');
    const btnFontDecrease = document.getElementById('btnFontDecrease');
    const pausarMdBtn = document.getElementById('pausarMdBtn');

    // Verificar si hay datos de continuar MD
    const continueMd = localStorage.getItem(LS_KEYS.MD_CONTINUE);
    let headerIdInicio = null;
    let fechaPausadoMd = null;
    if (continueMd === 'true') {
      const datosGuardados = localStorage.getItem(LS_KEYS.MD_PAUSADO);
      if (datosGuardados) {
        const datos = JSON.parse(datosGuardados);
        headerIdInicio = datos.headerId;
        fechaPausadoMd = datos.fechaPausado;
      }
      // Limpiar flag de continuar
      localStorage.removeItem(LS_KEYS.MD_CONTINUE);
    }

    // Obtener parámetro de la URL
    function getUrlParameter(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    function getAlertTitle(type) {
      const titles = {
        note: 'Nota',
        tip: 'Consell',
        important: 'Important',
        warning: 'Avís',
        caution: 'Precaució'
      };

      return titles[type] || type.charAt(0).toUpperCase() + type.slice(1);
    }

    function renderAlertHtml(type, title, bodyLines) {
      const normalizedType = type.toLowerCase();
      const innerMarkdown = bodyLines.join('\n').trim();
      const innerHtml = innerMarkdown
        ? marked.parse(transformGitHubAlerts(innerMarkdown)).trim()
        : '';

      return [
        `<div class="markdown-alert markdown-alert-${normalizedType}">`,
        `<p class="markdown-alert-title">${title}</p>`,
        innerHtml,
        '</div>'
      ].join('\n');
    }

    function transformGitHubAlerts(mdText) {
      const lines = mdText.split(/\r?\n/);
      const output = [];

      for (let index = 0; index < lines.length; index += 1) {
        const match = lines[index].match(/^>\s*\[!([A-Z]+)\](?:\s+(.*))?\s*$/i);

        if (!match) {
          output.push(lines[index]);
          continue;
        }

        const type = match[1].toLowerCase();
        const title = (match[2] || '').trim() || getAlertTitle(type);
        const bodyLines = [];

        index += 1;
        while (index < lines.length) {
          const line = lines[index];

          if (/^>\s?(.*)$/.test(line)) {
            bodyLines.push(line.replace(/^>\s?/, ''));
            index += 1;
            continue;
          }

          if (line.trim() === '') {
            bodyLines.push('');
            index += 1;
            continue;
          }

          break;
        }

        output.push(renderAlertHtml(type, title, bodyLines));
        index -= 1;
      }

      return output.join('\n');
    }

    function getEmbeddedImageMimeType(src) {
      const match = src.match(/^data:([^;,]+)[;,]/i);
      return match ? match[1].toLowerCase() : null;
    }

    function isRenderableEmbeddedImage(mimeType) {
      return [
        'image/png',
        'image/jpeg',
        'image/jpg',
        'image/gif',
        'image/webp',
        'image/avif',
        'image/svg+xml',
        'image/bmp'
      ].includes(mimeType);
    }

    function replaceUnsupportedEmbeddedImages(container) {
      const images = container.querySelectorAll('img[src^="data:image/"]');

      images.forEach(img => {
        const mimeType = getEmbeddedImageMimeType(img.getAttribute('src') || '');

        if (!mimeType || isRenderableEmbeddedImage(mimeType)) {
          return;
        }

        const warning = document.createElement('div');
        warning.className = 'embedded-image-warning';
        warning.innerHTML = `
          <strong>Imatge incrustada no compatible</strong><br>
          El visor accepta imatges base64, però aquest format no el pot renderitzar el navegador: <code>${mimeType}</code>.<br>
          Converteix-la a <code>image/png</code>, <code>image/jpeg</code>, <code>image/webp</code> o <code>image/svg+xml</code>.
        `.trim();

        img.replaceWith(warning);
      });
    }

    function mdToHtmlWithMermaid(mdText) {
      // Render básico a HTML
      const html = marked.parse(transformGitHubAlerts(mdText));

      // Inyecta en el DOM primero
      const container = document.getElementById("content");
      container.innerHTML = html;

      replaceUnsupportedEmbeddedImages(container);

      // Busca bloques de código "mermaid" y reemplázalos por <div class="mermaid">...</div>
      const codeBlocks = container.querySelectorAll('pre > code.language-mermaid, pre > code.lang-mermaid, pre > code[class*="mermaid"]');

      codeBlocks.forEach(code => {
        const pre = code.parentElement;
        const mermaidSrc = code.textContent;

        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = mermaidSrc;

        pre.replaceWith(div);
      });

      // Ahora renderiza Mermaid sobre los div.mermaid
      mermaid.run({ querySelector: ".mermaid" });

      // Generar TOC
      generateToc();
    }

    // Agregar IDs a encabezados
    function addHeaderIds() {
      const headers = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4, #content h5, #content h6');
      headers.forEach((header, index) => {
        if (!header.id) {
          const text = header.textContent.trim();
          const id = text
            .toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .substring(0, 50);
          header.id = id || `heading-${index}`;
        }
      });
    }

    // Generar TOC
    function generateToc() {
      addHeaderIds();

      const headers = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4, #content h5, #content h6');
      tocList.innerHTML = '';

      if (headers.length === 0) {
        tocList.innerHTML = '<li style="color: #a0a8c0; padding: 10px;">No hi ha encapçalaments</li>';
        return;
      }

      headers.forEach((header, index) => {
        const level = parseInt(header.tagName.charAt(1));
        const text = header.textContent.trim();
        const id = header.id || `heading-${index}`;

        const li = document.createElement('li');
        li.className = `toc-item level-${level}`;

        const a = document.createElement('a');
        a.className = 'toc-link';
        a.href = `#${id}`;
        a.textContent = text;
        a.addEventListener('click', (e) => {
          e.preventDefault();
          scrollToHeader(id);
        });

        li.appendChild(a);
        tocList.appendChild(li);
      });

      setupTocActiveTracking();
    }

    // Scroll a encabezado
    function scrollToHeader(id) {
      const element = document.getElementById(id);
      if (element) {
        const elementRect = element.getBoundingClientRect();
        const containerRect = mainPanel.getBoundingClientRect();
        const scrollTop = mainPanel.scrollTop;
        const targetPosition = scrollTop + (elementRect.top - containerRect.top) - 20;
        
        mainPanel.scrollTo({
          top: targetPosition,
          behavior: 'smooth'
        });
      }
    }

    // Seguimiento activo del TOC
    function setupTocActiveTracking() {
      const headers = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4, #content h5, #content h6');
      const tocLinks = tocList.querySelectorAll('.toc-link');

      mainPanel.addEventListener('scroll', () => {
        let current = '';
        
        headers.forEach(header => {
          const rect = header.getBoundingClientRect();
          if (rect.top < 150) {
            current = header.id;
          }
        });

        tocLinks.forEach(link => {
          link.classList.remove('active');
          if (link.getAttribute('href') === `#${current}`) {
            link.classList.add('active');
          }
        });
      });
    }

    // Cargar archivo desde URL
    async function loadMarkdownFromUrl() {
      const root = getUrlParameter('root') || 'apunts_new';
      const fitxer = getUrlParameter('fitxer');
      const tema = getUrlParameter('tema');
      
      if (!fitxer) {
        document.getElementById("content").innerHTML = `
          <blockquote>
            <p><strong>Error:</strong> No s'ha especificat cap fitxer.</p>
            <p>Utilitza: <code>?root=apunts_new&fitxer=T31_UC4_vs_UiPath.md&tema=T31</code></p>
          </blockquote>
        `;
        infoLabel.textContent = 'Error';
        return;
      }

      // Mostrar nombre del fichero sin extensión
      const fileName = fitxer.replace(/\.[^/.]+$/, '');
      infoLabel.textContent = fileName;

      // Construir ruta: root/tema/fitxer
      let markdownUrl = tema ? `/${root}/${tema}/${fitxer}` : `/${root}/${fitxer}`;

      try {
        const resp = await fetch(markdownUrl);
        if (!resp.ok) throw new Error("No se pudo cargar el archivo: " + resp.status);
        
        const text = await resp.text();
        mdToHtmlWithMermaid(text);

        // Si hay headerId de continuar, hacer scroll y mostrar indicador
        if (headerIdInicio) {
          setTimeout(() => {
            const targetHeader = document.getElementById(headerIdInicio);
            
            if (targetHeader) {
              // Crear indicador de continuar
              const indicator = document.createElement('div');
              indicator.className = 'continue-indicator-md';
              indicator.id = 'continueIndicator';
              indicator.innerHTML = `
                <span>▼ Continuar apunts</span>
                <span class="fecha">${fechaPausadoMd ? new Date(fechaPausadoMd).toLocaleDateString('ca-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''}</span>
              `;
              indicator.style.marginBottom = '20px';
              
              // Insertar antes del encabezado
              targetHeader.parentNode.insertBefore(indicator, targetHeader);
              
              // Hacer scroll al indicador
              setTimeout(() => {
                indicator.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }, 100);
            }
          }, 500);
        }
      } catch (e) {
        document.getElementById("content").innerHTML = `
          <blockquote>
            <p><strong>Error cargando fichero:</strong> ${String(e.message || e)}</p>
            <p>Ruta intentada: <code>${markdownUrl}</code></p>
          </blockquote>
        `;
        infoLabel.textContent = 'Error';
      }
    }

    // Toggle menú
    menuBtn.addEventListener('click', () => {
      menuPanel.classList.toggle('visible');
    });

    // Cerrar menú
    menuCloseBtn.addEventListener('click', () => {
      menuPanel.classList.remove('visible');
    });

    // Cerrar menú al hacer clic fuera
    document.addEventListener('click', (e) => {
      if (!menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
        menuPanel.classList.remove('visible');
      }
    });

    // Botón fullscreen
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          fullscreenBtn.innerHTML = '⛶ Sortir pantalla completa';
          menuPanel.classList.remove('visible');
        }).catch(err => {
          console.error('Error al activar fullscreen:', err);
        });
      } else {
        document.exitFullscreen().then(() => {
          fullscreenBtn.innerHTML = '⛶ Pantalla completa';
          menuPanel.classList.remove('visible');
        });
      }
    });

    // Actualizar texto del botón cuando se sale de fullscreen con ESC
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fullscreenBtn.innerHTML = '⛶ Pantalla completa';
      }
    });

    // Botón tornar
    tornarBtn.addEventListener('click', () => {
      tiraPaAtras();
    });

    // Capturar tecla Backspace para volver atrás
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace') {
        if (document.activeElement.tagName !== 'INPUT' && 
            document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          tiraPaAtras();
        }
      }
    });

    function tiraPaAtras() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    // Botón toggle TOC
    btnToggleToc.addEventListener('click', () => {
      tocVisible = !tocVisible;
      
      if (tocVisible) {
        tocPanel.classList.remove('hidden');
        mainPanel.classList.remove('full-width');
      } else {
        tocPanel.classList.add('hidden');
        mainPanel.classList.add('full-width');
      }
      menuPanel.classList.remove('visible');
    });

    // Botón aumentar tamaño de letra
    btnFontIncrease.addEventListener('click', () => {
      if (currentFontSize < maxFontSize) {
        currentFontSize += 2;
        contentDiv.style.fontSize = `${currentFontSize}px`;
      }
    });

    // Botón disminuir tamaño de letra
    btnFontDecrease.addEventListener('click', () => {
      if (currentFontSize > minFontSize) {
        currentFontSize -= 2;
        contentDiv.style.fontSize = `${currentFontSize}px`;
      }
    });

    // Modo selección para pausar apuntes
    let modoSeleccionPausa = false;

    // Botón pausar apuntes MD
    pausarMdBtn.addEventListener('click', () => {
      menuPanel.classList.remove('visible');
      
      // Activar modo selección
      modoSeleccionPausa = true;
      contentDiv.style.cursor = 'crosshair';
      
      // Mostrar toast informativo
      if (window.toast && toast.showToast) {
        toast.showToast('👆 Toca el títol o text on vols continuar la pròxima vegada', 5000);
      } else {
        alert('Toca el títol o text on vols continuar la pròxima vegada');
      }
    });

    // Listener para capturar clic en modo selección
    contentDiv.addEventListener('click', (e) => {
      if (!modoSeleccionPausa) return;
      
      e.preventDefault();
      e.stopPropagation();
      
      // Desactivar modo selección
      modoSeleccionPausa = false;
      contentDiv.style.cursor = '';
      
      // Buscar el encabezado más cercano (hacia arriba)
      let targetElement = e.target;
      let headerId = null;
      
      // Si el elemento clicado es un encabezado, usarlo directamente
      if (/^H[1-6]$/.test(targetElement.tagName)) {
        headerId = targetElement.id;
      } else {
        // Buscar el encabezado anterior más cercano
        const allHeaders = Array.from(contentDiv.querySelectorAll('h1, h2, h3, h4, h5, h6'));
        const clickedRect = targetElement.getBoundingClientRect();
        
        let closestHeader = null;
        for (const header of allHeaders) {
          const headerRect = header.getBoundingClientRect();
          // Solo considerar encabezados que estén antes o al mismo nivel del clic
          if (headerRect.top <= clickedRect.top) {
            closestHeader = header;
          }
        }
        
        if (closestHeader) {
          headerId = closestHeader.id;
        }
      }
      
      // Guardar datos en localStorage
      const root = getUrlParameter('root') || 'apunts_new';
      const fitxer = getUrlParameter('fitxer');
      const tema = getUrlParameter('tema');
      
      const datosMd = {
        root: root,
        fitxer: fitxer,
        tema: tema,
        headerId: headerId,
        fileName: fitxer ? fitxer.replace(/\.[^/.]+$/, '') : 'Apuntes',
        fechaPausado: new Date().toISOString(),
        urlCompleta: window.location.href
      };
      localStorage.setItem(LS_KEYS.MD_PAUSADO, JSON.stringify(datosMd));
      
      // Mostrar confirmación y redirigir
      const headerText = headerId ? document.getElementById(headerId)?.textContent?.substring(0, 30) + '...' : 'inici';
      alert(`Apuntes pausats a: "${headerText}"\nPots continuar des del menú principal.`);
      window.location.href = 'index.html?highlight=apuntes';
    });

    // Cargar al iniciar
    loadMarkdownFromUrl();
  </script>
</body>
</html>
