<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Daypo XML → QuestionContract JSON</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    textarea {
      width: 100%;
      height: 250px;
      font-family: monospace;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
    }
    pre {
      background: #f4f4f4;
      padding: 15px;
      overflow: auto;
      max-height: 300px;
    }
  </style>
  <script src="assets/js/toast.js"></script>
</head>
<body>

<h2>👽 Daypo XML → QuestionContract JSON</h2>

<p>Pega aquí el XML de Daypo:</p>
<textarea id="xmlInput" style="height: 50px; background-color: aquamarine;"></textarea>

<label>SubjectId:</label>
<select id="subjectId" style="min-width:180px;"></select>

<label>Origin:</label>
<input id="origin" value="daypo" />

<br><br>
<button onclick="convert()">Convertir</button>
<button onclick="copyJSON()">Copiar JSON</button>
<button onclick="window.location.href='index.html'">⬅️ Tornar al menú</button>

<h3>Resultado JSON</h3>
<pre id="output"></pre>
<script src="assets/js/login.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
<script src="assets/js/localstorage-utils.js"></script>

<script>

  // Usar la función checkUserAuth desde login.js
  document.addEventListener('DOMContentLoaded', function() {
    const userName = localStorage.getItem(LS_KEYS.USER_NAME);
    const userPass = localStorage.getItem(LS_KEYS.USER_PASS);
    login.checkUserAuth(userName, userPass);

    // Cargar temas desde el JSON y poblar el selector
    fetch('assets/opos24_temes.json')
      .then(r => r.json())
      .then(data => {
        const select = document.getElementById('subjectId');
        select.innerHTML = '';
        data.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.tema;
          opt.textContent = item.tema + ' - ' + item.titol;
          select.appendChild(opt);
        });
      })
      .catch(() => {
        toast.showToast('Error carregant temes');
      });
  }, {once:true});


function uuidv4() {
  return crypto.randomUUID();
}

function patternToBools(pattern) {
  return pattern.trim().split("").map(c => c === "2");
}

function convert() {
  const xmlText = document.getElementById("xmlInput").value;
  const subjectId = document.getElementById("subjectId").value;
  if(subjectId.trim() === "") {
    toast.showToast('El SubjectId no pot estar buit.');
    return;
  }
  const origin = document.getElementById("origin").value;

  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, "application/xml");

  const questionNodes = xml.querySelectorAll("test > c > c");
  const questions = [];

  questionNodes.forEach(qnode => {
    const questionText =
      qnode.querySelector(":scope > p")?.textContent.trim() ?? "";

    const pattern =
      qnode.querySelector(":scope > c")?.textContent.trim() ?? "";

    const options = Array.from(
      qnode.querySelectorAll(":scope > r > o")
    ).map(o => o.textContent.trim());

    const hint =
      qnode.querySelector(":scope > h")?.textContent.trim();

    if (!questionText || options.length === 0 || !pattern) return;

    const correctness = patternToBools(pattern);

    const answerOptions = options.map((text, i) => ({
      text,
      isCorrect: correctness[i] || false,
    }));

    const questionObj = {
      guid: uuidv4(),
      subjectId,
      difficulty: 1,
      origin,
      type: "test",
      question: questionText,
      answerOptions
    };

    if (hint) {
      questionObj.hint = hint;
    }

    questions.push(questionObj);
  });

  document.getElementById("output").textContent =
    JSON.stringify(questions, null, 2);

  window._jsonResult = questions;
}

function copyJSON() {
  if (!window._jsonResult || window._jsonResult.length === 0) {
    toast.showToast('No hi ha JSON per copiar. Converteix primer!');
    return;
  }
  
  const jsonText = JSON.stringify(window._jsonResult, null, 2);
  navigator.clipboard.writeText(jsonText)
    .then(() => {
      toast.showToast('JSON copiat al portapapers!');
    })
    .catch(err => {
      console.error('Error copiant:', err);
      toast.showToast('Error copiant al portapapers');
    });
}
</script>


</body>
</html>
