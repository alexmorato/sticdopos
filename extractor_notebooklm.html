<!DOCTYPE html>
<html lang="es">
<head>

  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-TZKHF359');</script>

  <meta charset="UTF-8">
  <title>Conversor de texto escapado a JSON</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      background: #f6f8fa;
      color: #222;
    }
    h1 { color: #333; }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-family: monospace;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      background: #fff;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #0077cc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #005fa3; }
    pre {
      background: #fff;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      overflow-x: auto;
      white-space: pre-wrap;
    }
    .buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #status {
      font-size: 0.9em;
      color: #555;
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TZKHF359"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <h1>🧩 Conversor de texto escapado a JSON</h1>
  <div style="margin-bottom:18px;">
    <label for="temaSelect"><b>Tema:</b></label>
    <select id="temaSelect" style="min-width:220px;"></select>
  </div>
  <div style="margin-bottom:1px;">
    <label style="display:inline-flex;align-items:center;gap:10px;">
      <input type="checkbox" id="flashcardsCheckbox"> Flashcards
      <span style="font-size:0.98em;">Dificultat:</span>
      <select id="difficultySelect" style="min-width:80px;">
      </select>
      </select>
    </label>
  </div>
  <p>Pega aquí el texto crudo del response (con <code>\\n</code>, <code>\\u0026quot;</code>, etc.):</p>
  <textarea id="input"></textarea>
  <div class="buttons">
  <button id="convertBtn">Convertir a JSON</button>
  <button id="copyBtn">📋 Copiar JSON</button>
  <button id="downloadBtn">📁 Descargar fichero .json</button>
  <button id="saveBtn">💾 API</button>
  <button onclick="window.location.href='index.html'">⬅️ Tornar al menú</button>
  <span id="status"></span>
  </div>
  <h2>Resultado:</h2>
  <pre id="output"></pre>

  <script src="assets/js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
  <script src="assets/js/localstorage-utils.js"></script>

  <script>
    // Usar la función checkUserAuth desde login.js
    document.addEventListener('DOMContentLoaded', function() {
      const userName = localStorage.getItem(LS_KEYS.USER_NAME);
      const userPass = localStorage.getItem(LS_KEYS.USER_PASS);
      login.checkUserAuth(userName, userPass);
    }, {once:true});

    // Variable global para almacenar las dificultades
    let difficultyOptions = [];
    
    // Rellenar selector de dificultad desde assets/difficulty.json
    window.addEventListener('DOMContentLoaded', function() {
      fetch('assets/difficulty.json')
        .then(r => r.json())
        .then(arr => {
          difficultyOptions = arr; // Guardar en variable global
          const sel = document.getElementById('difficultySelect');
          if (!sel) return;
          sel.innerHTML = '';
          arr.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.id;
            opt.textContent = d.text;
            sel.appendChild(opt);
          });
        });
    });


    // Utilidad para obtener el año actual
    function getCurrentYear() {
      return new Date().getFullYear();
    }

    // Guardar en DB: popup de confirmación
    document.getElementById('saveBtn').addEventListener('click', function() {
      const temaSel = document.getElementById('temaSelect');
      const tema = temaSel ? temaSel.value : '';
      let jsonData;
      try {
        jsonData = JSON.parse(document.getElementById('output').textContent);
      } catch (e) {
        alert('El JSON no es válido.');
        return;
      }
      const info = {
        tema: tema,
        font: 'notebooklm',
        any: getCurrentYear(),
        dades: jsonData
      };
      // Mostrar confirmación
      const msg =
        '¿Guardar en la base de datos?\n' +
        'Tema: ' + info.tema + '\n' +
        'Font: ' + info.font + '\n' +
        'Any: ' + info.any + '\n' +
        'Dades: ' + JSON.stringify(info.dades, null, 2).slice(0, 400) + (JSON.stringify(info.dades).length > 400 ? '\n... (truncat)' : '');
      if (confirm(msg)) {
        send_question_toDB(info);
      } else {
        status.textContent = '❌ Cancel·lat';
      }

    // Stub para enviar a la base de datos
    function send_question_toDB(info) {
      // Leer configuración de la API desde assets/API_config.json
      fetch('assets/API_config.json')
        .then(r => r.json())
        .then(config => {
          const API_URL = config.BASE_URL.replace(/\/?$/, '') + '/preguntas-notelm';
          const API_KEY = config.API_KEY;
          // Recorrer info.dades.quiz si existe y es array
          if (info && info.dades && Array.isArray(info.dades.quiz)) {
            let total = info.dades.quiz.length;
            let guardadas = 0, fallidas = 0;
            status.textContent = `⏳ Guardant ${total} preguntes...`;
            info.dades.quiz.forEach((q, idx) => {
              // Construir objeto a guardar
              const data = {
                tema: info.tema,
                font: info.font,
                any: info.any,
                ...q
              };
              fetch(API_URL, {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  'x-apikey': API_KEY,
                  'cache-control': 'no-cache'
                },
                body: JSON.stringify(data)
              })
              .then(resp => {
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                return resp.json();
              })
              .then(response => {
                guardadas++;
                status.textContent = `✅ Guardades: ${guardadas} / ${total}  ❌ Fallides: ${fallidas}`;
                // console.log('Guardada:', response);
              })
              .catch(err => {
                fallidas++;
                status.textContent = `✅ Guardades: ${guardadas} / ${total}  ❌ Fallides: ${fallidas}`;
                // console.error('Error guardant:', err);
              });
            });
          } else {
            status.textContent = '⚠️ No s\'ha trobat cap array quiz en dades.';
          }
        })
        .catch(() => {
          status.textContent = '❌ Error carregant configuració de la API.';
        });
    }
    });

    // Cargar temas al iniciar
    window.addEventListener('DOMContentLoaded', function() {
      fetch('assets/opos24_temes.json')
        .then(r => r.json())
        .then(temes => {
          const select = document.getElementById('temaSelect');
          select.innerHTML = '';
          // Leer tema guardado en localStorage
          const temaGuardado = localStorage.getItem('notebooklmextractor_tema');
          let temaSeleccionado = false;
          temes.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.tema;
            opt.textContent = t.tema + ' - ' + t.titol;
            if (temaGuardado && t.tema === temaGuardado) {
              opt.selected = true;
              temaSeleccionado = true;
            }
            select.appendChild(opt);
          });
          // Si no se encontró el tema guardado, seleccionar el primero
          if (!temaSeleccionado && select.options.length > 0) {
            select.selectedIndex = 0;
          }
        })
        .catch(() => {
          const select = document.getElementById('temaSelect');
          select.innerHTML = '<option>Error carregant temes</option>';
        });
    });
    // Decodificador HTML (&quot;, &#39;, etc.)
    function htmlUnescape(str) {
      const temp = document.createElement("textarea");
      temp.innerHTML = str;
      return temp.value;
    }

    // Proceso completo de limpieza
    function unescapeAndParse(raw) {
      let step = raw;

      // 1️⃣ Desescapar entidades HTML primero (&quot; → ", &#39; → ', etc.)
      step = htmlUnescape(step);

      // 2️⃣ Si después de desescapar HTML sigue habiendo escapes dobles, limpiarlos
      // Solo si detectamos que hay \\n o \\u en el texto
      if (step.includes('\\\\n') || step.includes('\\\\u')) {
        step = step.replace(/\\\\/g, "\\");
      }

      // 3️⃣ Intentar parsear a JSON directamente
      // Si falla, intentar con más limpieza
      try {
        return JSON.parse(step);
      } catch (firstError) {
        // Si falla, intentar decodificar secuencias de escape adicionales
        
        // Reemplazar \n por saltos de línea reales solo si están dentro de strings
        step = step.replace(/\\n/g, "\n");
        
        // Decodificar unicode (\uXXXX)
        step = step.replace(/\\u([\dA-F]{4})/gi, (_, g) => String.fromCharCode(parseInt(g, 16)));
        
        return JSON.parse(step);
      }
    }

    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const copyBtn = document.getElementById("copyBtn");

    // Generador simple de GUID
    function guid() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    const downloadBtn = document.getElementById('downloadBtn');
    
    // Función de preproceso para eliminar las secciones app-root
    function preprocessInput(text) {
      let result = text;
      
      // 1. Eliminar desde el inicio hasta la línea con <app-root data-app-data=" (incluida)
      const appRootStartIndex = result.indexOf('<app-root');
      if (appRootStartIndex !== -1) {
        // Buscar el final de esa línea (después de data-app-data=")
        const dataAppDataIndex = result.indexOf('data-app-data="', appRootStartIndex);
        if (dataAppDataIndex !== -1) {
          // Eliminar todo desde el inicio hasta después de data-app-data="
          result = result.substring(dataAppDataIndex + 'data-app-data="'.length);
        }
      }
      
      // 2. Eliminar desde " data-client-experiment-payload hasta el final (incluyendo </app-root>)
      const appRootEndMarker = '</app-root>';
      const appRootEndIndex = result.lastIndexOf(appRootEndMarker);
      if (appRootEndIndex !== -1) {
        // Buscar hacia atrás desde appRootEndIndex el cierre de comillas " data-client-experiment
        // Buscamos la comilla que cierra data-app-data
        const beforeAppRootEnd = result.substring(0, appRootEndIndex);
        const lastQuoteBeforeEnd = beforeAppRootEnd.lastIndexOf('" data-client-experiment-payload');
        if (lastQuoteBeforeEnd !== -1) {
          result = result.substring(0, lastQuoteBeforeEnd);
        }
      }
      
      return result.trim();
    }
    
    document.getElementById("convertBtn").addEventListener("click", () => {
      try {
        // Guardar tema seleccionado en localStorage
        const temaSel = document.getElementById('temaSelect');
        if (temaSel) {
          localStorage.setItem('notebooklmextractor_tema', temaSel.value);
        }
        
        // Preprocesar el input para eliminar las secciones app-root
        const preprocessedInput = preprocessInput(input.value);
        const jsonData = unescapeAndParse(preprocessedInput);
        const isFlashcards = document.getElementById('flashcardsCheckbox').checked;
        
        if (isFlashcards && jsonData && Array.isArray(jsonData.flashcards)) {
          // Formato flashcards: generar array de QuestionContract
          const tema = temaSel ? temaSel.value : '';
          const diffSel = document.getElementById('difficultySelect');
          const dificultadElegida = diffSel ? Number(diffSel.value) : 0;
          const origin = 'notebooklm';
          const result = jsonData.flashcards.map(card => ({
            guid: guid(),
            subjectId: tema,
            difficulty: dificultadElegida,
            origin: origin,
            type: 'flashcard',
            question: card.f,
            answerOptions: [
              {
                text: 'Me la sé ✅',
                isCorrect: true,
                rationale: card.b
              },
              {
                text: '🤔 Ara no recordo',
                isCorrect: false,
                rationale: 'Cada intent suma! 💪'
              }
            ],
            hint: card.hint || ''
          }));
          output.textContent = JSON.stringify(result, null, 2);
          status.textContent = `✅ ${result.length} flashcards convertidas (QuestionContract).`;
        } else if (!isFlashcards && jsonData && Array.isArray(jsonData.quiz)) {
          // Formato quiz original
          const tema = temaSel ? temaSel.value : '';
          const diffSel = document.getElementById('difficultySelect');
          const dificultadElegida = diffSel ? Number(diffSel.value) : 0;
          const result = jsonData.quiz.map(q => ({
            guid: guid(),
            subjectId : tema,
            origin: 'notebooklm',
            type: 'test',
            difficulty: typeof q.difficulty === 'number' ? q.difficulty : dificultadElegida,
            question: q.question,
            answerOptions: q.answerOptions.map(opt => ({
              text: opt.text,
              rationale: opt.rationale || '',
              isCorrect: opt.isCorrect
            })),
            hint: q.hint || ''
          }));
          output.textContent = JSON.stringify(result, null, 2);
          status.textContent = `✅ ${result.length} preguntas convertidas.`;
        } else {
          output.textContent = JSON.stringify(jsonData, null, 2);
          status.textContent = "✅ Conversión completada correctamente.";
        }
      } catch (err) {
        output.textContent = "❌ Error al convertir: " + err.message;
        status.textContent = "";
      }
    });


    downloadBtn.addEventListener('click', function() {
      let data = output.textContent;
      if (!data) return;
      // Nombre: temaId-nombre_sin_caracteres_raros_trim30-userName-dificultat.json
      const temaSel = document.getElementById('temaSelect');
      const temaId = temaSel ? temaSel.value : 'tema';
      // Buscar nombre del tema
      let temaNombre = '';
      const opts = temaSel && temaSel.options;
      if (opts && opts.length) {
        const opt = opts[temaSel.selectedIndex];
        if (opt) {
          temaNombre = opt.textContent.replace(/^\w+\s*-\s*/, '');
        }
      }
      // Limpiar nombre: solo letras, numeros y guion_bajo
      temaNombre = temaNombre.normalize('NFD').replace(/[^\w\s-]/g, '').replace(/\s+/g, '_').toLowerCase();
      const MAX_LEN = 45;
      if (temaNombre.length > MAX_LEN) temaNombre = temaNombre.slice(0, MAX_LEN);
      
      // Obtener nombre del usuario logado
      let userName = localStorage.getItem(LS_KEYS.USER_NAME) || 'user';
      userName = userName.normalize('NFD').replace(/[^\w\s-]/g, '').replace(/\s+/g, '_').toLowerCase();
      if (userName.length > 20) userName = userName.slice(0, 20);
      
      // Obtener dificultad normalizada
      const diffSel = document.getElementById('difficultySelect');
      const diffId = diffSel ? Number(diffSel.value) : 1;
      const diffObj = difficultyOptions.find(d => d.id === diffId);
      const diffNormalized = (diffObj && diffObj.textNormalized) ? diffObj.textNormalized.toLowerCase() : 'normal';
      
      const filename = `${temaId}-${temaNombre}-${userName}-${diffNormalized}.json`;
      // Descargar
      const blob = new Blob([data], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    });

    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(output.textContent)
        .then(() => { status.textContent = "📋 JSON copiado al portapapeles."; })
        .catch(() => { status.textContent = "⚠️ No se pudo copiar."; });
    });
  </script>
</body>
</html>
