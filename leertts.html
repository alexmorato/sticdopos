    .btn-text-action {

    .menu-btn span {

    .menu-panel {

  <div class="page">
    <section class="card">
      <div class="title">Lector de text TTS</div>
      <div class="subtitle" id="subtitle">Preparant fitxer...</div>
      <div class="status" id="statusMsg">Esperant</div>
    </section>

    <section class="card">
      <div class="controls-grid">
        <div class="control-row">
          <label for="languageSelect">Idioma</label>
          <select id="languageSelect"></select>
          <span class="control-value" id="languageValue">-</span>
        </div>

        <div class="control-row">
          <label for="voiceSelect">Veu</label>
          <select id="voiceSelect"></select>
          <span class="control-value" id="voiceValue">-</span>
        </div>

        <div class="control-row">
          <label for="rateSlider">Velocitat</label>
          <input type="range" id="rateSlider" min="0.5" max="2" step="0.05" value="1">

          <label for="pitchSlider">To</label>
          <input type="range" id="pitchSlider" min="0" max="2" step="0.1" value="1">

      <div class="btn-row">
        <button class="btn btn-play" id="playAllBtn">▶ Reproduir tot</button>

        <button class="btn btn-warn" id="stopBtn">⏹ Aturar</button>
      </div>
    </section>

    <section class="card">
      <div class="text-toolbar">
        <button class="btn-text-action" id="copyTextBtn">📋 Copiar text</button>
        <button class="btn-text-action" id="clearTextBtn">🗑️ Esborrar</button>
      </div>
      <div class="text-block" id="ttsTextContainer">
        <div class="empty-state">Carregant contingut...</div>
      </div>

  <script>
    const STORAGE = {
      rate: 'sTICdOpos_tts_rate',
      pitch: 'sTICdOpos_tts_pitch',
      lang: 'sTICdOpos_tts_lang',
      voice: 'sTICdOpos_tts_voice'
    };

    const statusMsg = document.getElementById('statusMsg');
    const subtitle = document.getElementById('subtitle');
    const ttsTextContainer = document.getElementById('ttsTextContainer');

    const languageSelect = document.getElementById('languageSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const languageValue = document.getElementById('languageValue');
    const voiceValue = document.getElementById('voiceValue');

    const rateSlider = document.getElementById('rateSlider');
    const pitchSlider = document.getElementById('pitchSlider');
    const rateValue = document.getElementById('rateValue');
    const pitchValue = document.getElementById('pitchValue');

    const playAllBtn = document.getElementById('playAllBtn');
    const playSelectionBtn = document.getElementById('playSelectionBtn');
    const stopBtn = document.getElementById('stopBtn');
    const copyTextBtn = document.getElementById('copyTextBtn');
    const clearTextBtn = document.getElementById('clearTextBtn');

    const menuBtn = document.getElementById('menuBtn');
    const menuPanel = document.getElementById('menuPanel');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const menuTornarBtn = document.getElementById('menuTornarBtn');
    const menuIndexBtn = document.getElementById('menuIndexBtn');
    const infoLabel = document.getElementById('infoLabel');

    const urlParams = new URLSearchParams(window.location.search);
    const root = urlParams.get('root') || 'apunts_new';
    const tema = urlParams.get('tema') || '';
    const fitxer = urlParams.get('fitxer') || '';

    let loadedText = '';
    let voices = [];
    let isSequentialReading = false;

    function setStatus(text, isError) {
      statusMsg.textContent = text;
      statusMsg.style.background = isError ? '#8a2a2a' : '#27304a';
    }

    function stopSpeaking() {
      isSequentialReading = false;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      ttsTextContainer.querySelectorAll('.para-item.reading').forEach(el => el.classList.remove('reading'));
      setStatus('Aturat', false);
    }

    function splitTextForTTS(text, maxLen) {
      const normalized = text.replace(/\s+/g, ' ').trim();
      if (!normalized) return [];

      const sentences = normalized.split(/(?<=[.!?])\s+/);
      const chunks = [];
      let buffer = '';

      for (const sentence of sentences) {
        if ((buffer + ' ' + sentence).trim().length <= maxLen) {
          buffer = (buffer + ' ' + sentence).trim();
          continue;
        }

        if (buffer) {
          chunks.push(buffer);
          buffer = '';
        }

        if (sentence.length <= maxLen) {
          buffer = sentence;
          continue;
        }

        let start = 0;
        while (start < sentence.length) {
          chunks.push(sentence.slice(start, start + maxLen));
          start += maxLen;
        }
      }

      if (buffer) chunks.push(buffer);
      return chunks;
    }

    function getSelectedVoice() {
      const selectedName = voiceSelect.value;
      if (!selectedName) return null;
      return voices.find(v => v.name === selectedName) || null;
    }

    function speakSequentially(text) {
      if (!('speechSynthesis' in window)) {
        setStatus('Web Speech API no disponible al navegador', true);
        return;
      }

      const chunks = splitTextForTTS(text, 220);
      if (!chunks.length) {
        setStatus('No hi ha text per reproduir', true);
        return;
      }

      stopSpeaking();
      isSequentialReading = true;
      setStatus('Reproduint...', false);

      let idx = 0;
      const voice = getSelectedVoice();
      const rate = parseFloat(rateSlider.value);
      const pitch = parseFloat(pitchSlider.value);
      const selectedLang = languageSelect.value || 'ca-ES';

      const playNext = () => {
        if (!isSequentialReading) return;
        if (idx >= chunks.length) {
          isSequentialReading = false;
          setStatus('Reproduccio finalitzada', false);
          return;
        }

        const utterance = new SpeechSynthesisUtterance(chunks[idx]);
        utterance.rate = rate;
        utterance.pitch = pitch;
        utterance.lang = selectedLang;
        if (voice) utterance.voice = voice;

        utterance.onend = () => {
          idx += 1;
          setTimeout(playNext, 120);
        };

        utterance.onerror = (event) => {
          console.error('Error TTS:', event);
          isSequentialReading = false;
          setStatus('Error en reproduccio TTS', true);
        };

        window.speechSynthesis.speak(utterance);
      };

      playNext();
    }

    function saveSetting(key, value) {
      localStorage.setItem(key, String(value));
    }

    function loadSavedSettings() {
      const savedRate = localStorage.getItem(STORAGE.rate);
      const savedPitch = localStorage.getItem(STORAGE.pitch);
      if (savedRate) rateSlider.value = savedRate;
      if (savedPitch) pitchSlider.value = savedPitch;

      rateValue.textContent = Number(rateSlider.value).toFixed(2);
      pitchValue.textContent = Number(pitchSlider.value).toFixed(1);
    }

    function updateLanguageList() {
      const langs = Array.from(new Set(voices.map(v => v.lang))).sort((a, b) => a.localeCompare(b));
      languageSelect.innerHTML = '';

      if (!langs.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'Sense idiomes detectats';
        languageSelect.appendChild(opt);
        languageValue.textContent = '-';
        return;
      }

      langs.forEach(lang => {
        const opt = document.createElement('option');
        opt.value = lang;
        opt.textContent = lang;
        languageSelect.appendChild(opt);
      });

      const preferred = localStorage.getItem(STORAGE.lang);
      const hasPreferred = preferred && langs.includes(preferred);
      const fallback = langs.find(l => l.startsWith('ca')) || langs.find(l => l.startsWith('es')) || langs[0];

      languageSelect.value = hasPreferred ? preferred : fallback;
      languageValue.textContent = languageSelect.value || '-';
      saveSetting(STORAGE.lang, languageSelect.value || '');
    }

    function updateVoiceList() {
      const selectedLang = languageSelect.value;
      const filtered = voices.filter(v => !selectedLang || v.lang === selectedLang);
      voiceSelect.innerHTML = '';

      if (!filtered.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'Sense veus disponibles';
        voiceSelect.appendChild(opt);
        voiceValue.textContent = '-';
        return;
      }

      filtered.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = v.name + ' (' + v.lang + ')';
        voiceSelect.appendChild(opt);
      });

      const preferred = localStorage.getItem(STORAGE.voice);
      const hasPreferred = preferred && filtered.some(v => v.name === preferred);
      const defaultVoice = filtered.find(v => v.default) || filtered[0];
      voiceSelect.value = hasPreferred ? preferred : defaultVoice.name;
      voiceValue.textContent = voiceSelect.value || '-';
      saveSetting(STORAGE.voice, voiceSelect.value || '');
    }

    function loadVoices() {
      const assign = () => {
        voices = window.speechSynthesis.getVoices();
        updateLanguageList();
        updateVoiceList();
      };

      assign();
      window.speechSynthesis.onvoiceschanged = assign;
    }

    function getSelectedTextFromContainer() {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return '';
      const selected = selection.toString().trim();
      if (!selected) return '';

      const range = selection.getRangeAt(0);
      const containerNode = ttsTextContainer;
      if (!containerNode.contains(range.commonAncestorContainer)) return '';
      return selected;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function getCurrentText() {
      if (ttsTextContainer.contentEditable === 'true') {
        return (ttsTextContainer.innerText || ttsTextContainer.textContent || '').trim();
      }
      const paras = ttsTextContainer.querySelectorAll('.para-item');
      if (paras.length) {
        return Array.from(paras).map(p => p.textContent).join('\n\n');
      }
      return loadedText;
    }

    function renderParagraphs(text) {
      const paras = text.split(/\n+/).map(p => p.trim()).filter(p => p);
      if (!paras.length) {
        ttsTextContainer.innerHTML = '<div class="empty-state">El fitxer TTS esta buit.</div>';
        return;
      }
      ttsTextContainer.contentEditable = 'false';
      ttsTextContainer.innerHTML = paras
        .map((p, i) => `<div class="para-item" data-para-index="${i}">${escapeHtml(p)}</div>`)
        .join('');
    }

    function speakByParagraphs(paragraphEls) {
      if (!('speechSynthesis' in window)) {
        setStatus('Web Speech API no disponible', true);
        return;
      }
      stopSpeaking();
      isSequentialReading = true;
      setStatus('Reproduint...', false);

      const voice = getSelectedVoice();
      const rate = parseFloat(rateSlider.value);
      const pitch = parseFloat(pitchSlider.value);
      const selectedLang = languageSelect.value || 'ca-ES';
      const MAX_RETRIES = 2;
      let idx = 0;
      let retries = 0;

      paragraphEls.forEach(el => el.classList.remove('reading'));

      const playNextParagraph = () => {
        if (!isSequentialReading) {
          paragraphEls.forEach(el => el.classList.remove('reading'));
          return;
        }
        if (idx >= paragraphEls.length) {
          isSequentialReading = false;
          paragraphEls.forEach(el => el.classList.remove('reading'));
          setStatus('Reproducció finalitzada', false);
          return;
        }

        const el = paragraphEls[idx];
        const fullText = (el.textContent || '').trim();

        paragraphEls.forEach(e => e.classList.remove('reading'));
        el.classList.add('reading');
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        if (!fullText) {
          idx += 1;
          retries = 0;
          setTimeout(playNextParagraph, 50);
          return;
        }

        const chunks = splitTextForTTS(fullText, 220);
        let chunkIdx = 0;

        const playNextChunk = () => {
          if (!isSequentialReading) return;
          if (chunkIdx >= chunks.length) {
            retries = 0;
            idx += 1;
            setTimeout(playNextParagraph, 120);
            return;
          }

          const utterance = new SpeechSynthesisUtterance(chunks[chunkIdx]);
          utterance.rate = rate;
          utterance.pitch = pitch;
          utterance.lang = selectedLang;
          if (voice) utterance.voice = voice;

          utterance.onend = () => {
            chunkIdx += 1;
            setTimeout(playNextChunk, 80);
          };

          utterance.onerror = (event) => {
            console.error('Error TTS al paràgraf', idx, event);
            if (retries < MAX_RETRIES) {
              retries += 1;
              setStatus(`Error al paràgraf ${idx + 1}, reintentant (${retries}/${MAX_RETRIES})...`, true);
              setTimeout(playNextChunk, 400);
            } else {
              retries = 0;
              idx += 1;
              setStatus(`Error al paràgraf ${idx}, passant al següent`, true);
              setTimeout(playNextParagraph, 300);
            }
          };

          window.speechSynthesis.speak(utterance);
        };

        playNextChunk();
      };

      playNextParagraph();
    }

    async function cargarTexto() {
      if (!fitxer) {
        subtitle.textContent = 'Falta fitxer TTS a la URL';
        ttsTextContainer.innerHTML = '<div class="error-state">No s\'ha especificat cap fitxer TTS.</div>';
        setStatus('Parametres invalids', true);
        return;
      }

      let adjustedRoot = root;
      if (location.pathname.includes('/opos/') && root.startsWith('opos/')) {
        adjustedRoot = root.substring(5);
      }

      const textPath = tema ? adjustedRoot + '/' + tema + '/' + fitxer : adjustedRoot + '/' + fitxer;
      const fileNameNoExt = fitxer.replace(/\.[^/.]+$/, '') || 'tts';
      infoLabel.textContent = fileNameNoExt;
      subtitle.textContent = textPath;

      try {
        const res = await fetch(textPath + '?v=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const rawText = await res.text();
        loadedText = rawText.replace(/^\uFEFF/, '').trim();

        if (!loadedText) {
          ttsTextContainer.innerHTML = '<div class="empty-state">El fitxer TTS esta buit.</div>';
          setStatus('Fitxer buit', true);
          return;
        }

        renderParagraphs(loadedText);
        setStatus('Text carregat', false);
      } catch (error) {
        console.error(error);
        ttsTextContainer.innerHTML = '<div class="error-state">Error carregant el fitxer TTS.<br>' + escapeHtml(textPath) + '</div>';
        setStatus('Error de carrega', true);
      }
    }

    function initMenu() {
      menuBtn.addEventListener('click', () => {
        menuPanel.classList.toggle('visible');
      });

      menuCloseBtn.addEventListener('click', () => {
        menuPanel.classList.remove('visible');
      });

      document.addEventListener('click', (e) => {
        if (!menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
          menuPanel.classList.remove('visible');
        }
      });

      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(() => {
            fullscreenBtn.textContent = '⛶ Sortir pantalla completa';
            menuPanel.classList.remove('visible');
          }).catch(err => {
            console.error('Error al activar fullscreen:', err);
          });
        } else {
          document.exitFullscreen().then(() => {
            fullscreenBtn.textContent = '⛶ Pantalla completa';
            menuPanel.classList.remove('visible');
          });
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          fullscreenBtn.textContent = '⛶ Pantalla completa';
        }
      });

      menuTornarBtn.addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'leerrecursos.html';
        }
      });

      menuIndexBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
      });
    }

    function initControls() {
      rateSlider.addEventListener('input', () => {
        const value = Number(rateSlider.value).toFixed(2);
        rateValue.textContent = value;
        saveSetting(STORAGE.rate, value);
      });

      pitchSlider.addEventListener('input', () => {
        const value = Number(pitchSlider.value).toFixed(1);
        pitchValue.textContent = value;
        saveSetting(STORAGE.pitch, value);
      });

      languageSelect.addEventListener('change', () => {
        languageValue.textContent = languageSelect.value || '-';
        saveSetting(STORAGE.lang, languageSelect.value || '');
        updateVoiceList();
      });

      voiceSelect.addEventListener('change', () => {
        voiceValue.textContent = voiceSelect.value || '-';
        saveSetting(STORAGE.voice, voiceSelect.value || '');
      });

      playAllBtn.addEventListener('click', () => {
        const text = getCurrentText();
        if (!text.trim()) {
          setStatus('No hi ha text per reproduir', true);
          return;
        }
        if (ttsTextContainer.contentEditable === 'true') {
          loadedText = text;
          renderParagraphs(loadedText);
        }
        const paragraphEls = Array.from(ttsTextContainer.querySelectorAll('.para-item'));
        if (paragraphEls.length) {
          speakByParagraphs(paragraphEls);
        } else {
          speakSequentially(text);
        }
      });

      playSelectionBtn.addEventListener('click', () => {
        const selected = getSelectedTextFromContainer();
        if (!selected) {
          setStatus('Selecciona text dins del bloc per reproduir-lo', true);
          return;
        }
        speakSequentially(selected);
      });

      stopBtn.addEventListener('click', () => {
        stopSpeaking();
      });

      copyTextBtn.addEventListener('click', async () => {
        const text = getCurrentText();
        if (!text.trim()) {
          setStatus('No hi ha text per copiar', true);
          return;
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }
          setStatus('Text copiat!', false);
        } catch (e) {
          setStatus('Error en copiar', true);
        }
      });

      clearTextBtn.addEventListener('click', () => {
        stopSpeaking();
        loadedText = '';
        ttsTextContainer.innerHTML = '';
        ttsTextContainer.contentEditable = 'true';
        ttsTextContainer.focus();
        setStatus('Pots enganxar o escriure text nou', false);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const userGuid = localStorage.getItem(LS_KEYS.USER_NAME);
      const userPass = localStorage.getItem(LS_KEYS.USER_PASS);
      login.checkUserAuth(userGuid, userPass, login.ROLES.VIP);

      initMenu();
      loadSavedSettings();
      if ('speechSynthesis' in window) {
        loadVoices();
      } else {
        setStatus('Web Speech API no disponible', true);
      }
      initControls();
      cargarTexto();
    }, { once: true });

    window.addEventListener('beforeunload', () => {
      stopSpeaking();
    });
  </script>
</body>
</html>
