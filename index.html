  <style>
    .menu-btn:disabled {
      opacity: 0.5;
      filter: grayscale(0.7);
      cursor: not-allowed;
      pointer-events: none;
      box-shadow: none;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #141a2a;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border: 1px solid #27304a;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .menu-btn {
      background: #1b223a;
      color: #e7ecff;
      border: 1px solid #2a3554;
      border-radius: 12px;
      padding: 20px;
      font-size: 1.6rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-btn:hover {
      background: #27304a;
      border-color: #6ae0a7;
      color: #6ae0a7;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(106, 224, 167, 0.2);
    }
    .footer {
      text-align: center;
      font-size: 13px;
      color: #9fb0ff;
      margin-top: 30px;
    }
    @media (max-width: 600px) {
      .container { margin: 0 10px; padding: 20px 6px; }
      .menu-grid { grid-template-columns: 1fr; gap: 6px; }
      .menu-btn { font-size: 1.3rem; padding: 6px; }
    }

    @media (max-height: 480px) {
      .container { margin: 0 10px; padding: 10px 6px; }
      .menu-grid { gap: 6px; }
      .menu-btn { font-size: 1.3rem; padding: 6px; }
    }

    /* Animación de pulso/latido para resaltar botones */
    @keyframes pulse-highlight {
      0% {
        box-shadow: 0 0 0 0 rgba(106, 224, 167, 0.7);
        background: #1b223a;
      }
      50% {
        box-shadow: 0 0 20px 10px rgba(106, 224, 167, 0.4);
        background: #2a5f4a;
      }
      100% {
        box-shadow: 0 0 0 0 rgba(106, 224, 167, 0.7);
        background: #1b223a;
      }
    }

    .menu-btn.pulse-animation {
      animation: pulse-highlight 1s ease-in-out 4;
      border-color: #6ae0a7;
    }

  </style>

<body>

  <div class="container">
    <div class="menu-grid">
      <button class="menu-btn" data-require-login="true" onclick="window.location.href='init.html'">

      <button class="menu-btn" data-require-login="true" data-require-VIP="true" onclick="window.location.href='leerrecursos.html'">

      </button>
      <button id="continuaYoutubeBtn" data-require-VIP="true" class="menu-btn" disabled onclick="continuaYoutube()">

      </button>
      <button id="continuaDiaposBtn" data-require-VIP="true" class="menu-btn" disabled onclick="continuaDiapos()">
        🖼️ Continua diapos
      </button>
      <button id="continuaApuntesBtn" data-require-VIP="true" class="menu-btn" disabled onclick="continuaApuntes()">
        📝 Continua apunts
      </button>
      <button class="menu-btn"  onclick="window.location.href='cargarManual.html'">

      <button class="menu-btn" onclick="window.location.href='historialErrors.html'">

      <button class="menu-btn" data-require-VIP="true" onclick="window.location.href='sync.html'">

      </button>
      <button class="menu-btn" onclick="window.location.href='last_test.html'">
        🗓️ Últims tests afegits
      </button>
      <button class="menu-btn" onclick="window.location.href='pined.html'">

      </button>
      <button class="menu-btn" onclick="window.location.href='generarJsonTest.html'">
        ⚗️ Generar JSON
      </button>
      <button class="menu-btn" data-require-login="true" onclick="window.location.href='quick_converter.html'">
        🚅 Quick Converter
      </button>
      <button class="menu-btn" data-require-VIP="true" onclick="window.location.href='wheel.html'">
        🎡 Rueda Aleatoria

      <button class="menu-btn" data-require-login="true" onclick="window.location.href='extractor_notebooklm.html'">

      </button>
      <button class="menu-btn" data-require-login="true" onclick="window.open('gestiosessio.html', '_blank', 'noopener,noreferrer')">
        ⚙️ Gestió de sessió
      </button>
      <button class="menu-btn" onclick="logout()">
        🙋🏻‍♂️ Tornar al login
      </button>
      <button class="menu-btn" id="testToastBtn" type="button">
        📢 Test Toast
      </button>
      <button style="display:none;" class="menu-btn" data-require-login="true" onclick="window.location.href='list.html'">
        📋 Escull tema OLD
      </button>
      <button style="display:none;" class="menu-btn" data-require-login="true" onclick="window.location.href='quizletformat.html'">

  <script src="assets/js/toast.js"></script>
  <script src="assets/js/localstorage-utils.js"></script>
  <script>
    // Función para capitalizar primera letra
    function capitalizeFirstLetter(string) {
      if (!string) return '';
      return string.charAt(0).toUpperCase() + string.slice(1).toLowerCase();
    }

    // Función para mostrar/ocultar botones según login
    async function toggleButtonsByLogin() {      
      const username = localStorage.getItem(LS_KEYS.USER_NAME);
      
      // Mostrar mensaje de bienvenida si está logueado
      const welcomeMessage = document.getElementById('welcomeMessage');
      if (username && username !== 'anonim') {
        const capitalizedName = capitalizeFirstLetter(username);
        welcomeMessage.textContent = `Hola ${capitalizedName}! 👋`;
        welcomeMessage.style.display = 'block';
      } else {
        welcomeMessage.style.display = 'none';
      }
      
      // Verificar rol VIP del usuario
      let isVIP = false;
      let isUser = false;
      if (username) {
        try {
          const usersData = await fetch('assets/users.json').then(r => r.json());
          const user = usersData.users.find(u => u.name === username);
          if (user && Array.isArray(user.role)) {
            if (user.role.includes('VIP')) {
              isVIP = true;
            }
            if (user.role.includes('user')) {
              isUser = true;
            }
          }
        } catch (e) {
          console.error('Error verificando rol VIP:', e);
        }
      }

      // Ocultar botones VIP si no es VIP
      const vipButtons = document.querySelectorAll('[data-require-VIP="true"]');
      if (!isVIP) {
        vipButtons.forEach(button => {
          button.style.display = 'none';
        });
      }

      // Ocultar botones protegidos si no tiene rol "user"
      const protectedButtons = document.querySelectorAll('[data-require-login="true"]');
      if (!isUser) {
        protectedButtons.forEach(button => {
          button.style.display = 'none';
        });
      }
      
    }

    // Ejecutar al cargar la página
    document.addEventListener('DOMContentLoaded', toggleButtonsByLogin);

    document.addEventListener('DOMContentLoaded', function() {
      const continuaEstudiBtn = document.getElementById('continuaEstudi');
      const continuaYoutubeBtn = document.getElementById('continuaYoutubeBtn');
      const continuaDiaposBtn = document.getElementById('continuaDiaposBtn');
      const continuaApuntesBtn = document.getElementById('continuaApuntesBtn');
      
      // Verificar si existe el item en localStorage para continuar estudio
      if (!localStorage.getItem(LS_KEYS.ESTUDIO_WIP)) {
        continuaEstudiBtn.disabled = true;
      } else {
        continuaEstudiBtn.disabled = false;
      }

      // Verificar si existe estudio YouTube pausado
      const datosYouTube = localStorage.getItem(LS_KEYS.YOUTUBE_PAUSADO);
      if (datosYouTube) {
        continuaYoutubeBtn.disabled = false;
        try {
          const datos = JSON.parse(datosYouTube);
          const tiempo = datos.tiempoFormateado || '';
          const nombre = datos.name || 'Video';
          // Mostrar info en el botón
          continuaYoutubeBtn.innerHTML = `▶️ Continua YouTube (${tiempo})`;
          continuaYoutubeBtn.title = `${nombre} - ${tiempo}`;
        } catch (e) {
          console.error('Error parsing YouTube data:', e);
        }
      } else {
        continuaYoutubeBtn.disabled = true;
      }

      // Verificar si existen diapos pausadas
      const datosDiapos = localStorage.getItem(LS_KEYS.DIAPOS_PAUSADO);
      if (datosDiapos) {
        continuaDiaposBtn.disabled = false;
        try {
          const datos = JSON.parse(datosDiapos);
          const slide = datos.slideNumber || 1;
          const total = datos.totalSlides || '?';
          const dirName = datos.dir || 'diapos';
          // Mostrar info en el botón
          continuaDiaposBtn.innerHTML = `🖼️ Continua diapos (${slide}/${total})`;
          continuaDiaposBtn.title = `${dirName} - Slide ${slide} de ${total}`;
        } catch (e) {
          console.error('Error parsing diapos data:', e);
        }
      } else {
        continuaDiaposBtn.disabled = true;
      }

      // Verificar si existen apuntes MD pausados
      const datosMd = localStorage.getItem(LS_KEYS.MD_PAUSADO);
      if (datosMd) {
        continuaApuntesBtn.disabled = false;
        try {
          const datos = JSON.parse(datosMd);
          const fileName = datos.fileName || 'Apunts';
          // Mostrar info en el botón
          continuaApuntesBtn.innerHTML = `📝 Continua apunts`;
          continuaApuntesBtn.title = fileName;
        } catch (e) {
          console.error('Error parsing MD data:', e);
        }
      } else {
        continuaApuntesBtn.disabled = true;
      }

      // Verificar si hay que resaltar algún botón (desde pausar YouTube/diapos/apuntes)
      const urlParams = new URLSearchParams(window.location.search);
      const highlight = urlParams.get('highlight');
      if (highlight === 'youtube' && !continuaYoutubeBtn.disabled) {
        continuaYoutubeBtn.classList.add('pulse-animation');
        // Quitar animación después de 4 segundos
        setTimeout(() => {
          continuaYoutubeBtn.classList.remove('pulse-animation');
        }, 4000);
        // Limpiar URL sin recargar
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      if (highlight === 'apuntes' && !continuaApuntesBtn.disabled) {
        continuaApuntesBtn.classList.add('pulse-animation');
        // Quitar animación después de 4 segundos
        setTimeout(() => {
          continuaApuntesBtn.classList.remove('pulse-animation');
        }, 4000);
        // Limpiar URL sin recargar
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      if (highlight === 'diapos' && !continuaDiaposBtn.disabled) {
        continuaDiaposBtn.classList.add('pulse-animation');
        // Quitar animación después de 4 segundos
        setTimeout(() => {
          continuaDiaposBtn.classList.remove('pulse-animation');
        }, 4000);
        // Limpiar URL sin recargar
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      if (highlight === 'test' && !continuaEstudiBtn.disabled) {
        continuaEstudiBtn.classList.add('pulse-animation');
        // Quitar animación después de 4 segundos
        setTimeout(() => {
          continuaEstudiBtn.classList.remove('pulse-animation');
        }, 4000);
        // Limpiar URL sin recargar
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });


    // Cargar headerTitle dinámicamente desde config.json
    fetch('assets/config.json')
      .then(r => r.json())
      .then(cfg => {
        if (cfg.headerTitle) {
          let title = cfg.headerTitle;
          if (cfg.headerTitleSectionText) {
            let section = '';
            const params = new URLSearchParams(window.location.search);
            if (params.has('section')) {
              section = params.get('section');
            }
            title = title.replace(cfg.headerTitleSectionText, section);
          }
          document.getElementById('headerTitle').textContent = title;
        }
      });

    document.getElementById('testToastBtn').onclick = function() {
      if (window.toast && toast.showToast) {
        toast.showToast('Test Toast OK!');
      } else {
        alert('toast.js no cargado');
      }
    };

    // Borrar el último error del historial
    function continuaEstudi() {
      localStorage.setItem(LS_KEYS.ESTUDIO_WIP_CONTINUE, 'true');
      window.location.href = 'estudiar.html';
    }
    // Continuar estudio de YouTube pausado
    function continuaYoutube() {
      const datosYouTube = localStorage.getItem(LS_KEYS.YOUTUBE_PAUSADO);
      if (datosYouTube) {
        try {
          const datos = JSON.parse(datosYouTube);
          // Establecer datos para iframe_viewer
          localStorage.setItem(LS_KEYS.IFRAME_URL, datos.url);
          localStorage.setItem(LS_KEYS.IFRAME_NAME, datos.name || 'Video YouTube');
          localStorage.setItem(LS_KEYS.IFRAME_TEMA, datos.tema || '');
          localStorage.setItem(LS_KEYS.IFRAME_TYPE, 'youtube');
          // Flag para indicar que debe continuar desde tiempo guardado
          localStorage.setItem(LS_KEYS.YOUTUBE_CONTINUE, 'true');
          window.location.href = 'iframe_viewer.html';
        } catch (e) {
          console.error('Error al continuar YouTube:', e);
          alert('Error al carregar les dades del vídeo guardat.');
        }
      }
    }

    // Continuar diapos pausadas
    function continuaDiapos() {
      const datosDiapos = localStorage.getItem(LS_KEYS.DIAPOS_PAUSADO);
      if (datosDiapos) {
        try {
          const datos = JSON.parse(datosDiapos);
          // Flag para indicar que debe continuar
          localStorage.setItem(LS_KEYS.DIAPOS_CONTINUE, 'true');
          // Navegar usando la URL guardada
          window.location.href = datos.urlCompleta;
        } catch (e) {
          console.error('Error al continuar diapos:', e);
          alert('Error al carregar les dades de les diapos guardades.');
        }
      }
    }

    // Continuar apuntes MD pausados
    function continuaApuntes() {
      const datosMd = localStorage.getItem(LS_KEYS.MD_PAUSADO);
      if (datosMd) {
        try {
          const datos = JSON.parse(datosMd);
          // Flag para indicar que debe continuar
          localStorage.setItem(LS_KEYS.MD_CONTINUE, 'true');
          // Navegar usando la URL guardada
          window.location.href = datos.urlCompleta;
        } catch (e) {
          console.error('Error al continuar apuntes:', e);
          alert('Error al carregar les dades dels apunts guardats.');
        }
      }
    }

    // Borrar el último error del historial
    function logout() {
      localStorage.removeItem(LS_KEYS.USER_NAME);
      localStorage.removeItem(LS_KEYS.USER_PASS);
      window.location.href = 'login.html';
    }

  </script>
