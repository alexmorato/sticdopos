  <script>
    // Función para capitalizar primera letra
    function capitalizeFirstLetter(string) {
      if (!string) return '';
      return string.charAt(0).toUpperCase() + string.slice(1).toLowerCase();
    }

    // Función para mostrar/ocultar botones según login
    async function toggleButtonsByLogin() {      
      const username = localStorage.getItem(LS_KEYS.USER_NAME);
      
      // Mostrar mensaje de bienvenida si está logueado
      const welcomeMessage = document.getElementById('welcomeMessage');
      if (username && username !== 'anonim') {
        const capitalizedName = capitalizeFirstLetter(username);
        welcomeMessage.textContent = `Hola ${capitalizedName}! 👋`;
        welcomeMessage.style.display = 'block';
      } else {
        welcomeMessage.style.display = 'none';
      }
      
      // Verificar rol VIP del usuario
      let isVIP = false;
      let isUser = false;
      if (username) {
        try {
          const usersData = await fetch('assets/users.json').then(r => r.json());
          const user = usersData.users.find(u => u.name === username);
          if (user && Array.isArray(user.role)) {
            if (user.role.includes('VIP')) {
              isVIP = true;
            }
            if (user.role.includes('user')) {
              isUser = true;
            }
          }
        } catch (e) {
          console.error('Error verificando rol VIP:', e);
        }
      }

      // Ocultar botones VIP si no es VIP
      const vipButtons = document.querySelectorAll('[data-require-VIP="true"]');
      if (!isVIP) {
        vipButtons.forEach(button => {
          button.style.display = 'none';
        });
      }

      // Ocultar botones protegidos si no tiene rol "user"
      const protectedButtons = document.querySelectorAll('[data-require-login="true"]');
      if (!isUser) {
        protectedButtons.forEach(button => {
          button.style.display = 'none';
        });
      }
      
    }

    // Ejecutar al cargar la página
    document.addEventListener('DOMContentLoaded', toggleButtonsByLogin);

    document.addEventListener('DOMContentLoaded', function() {
      const continuaEstudiBtn = document.getElementById('continuaEstudi');
      
      // Verificar si existe el item en localStorage
      if (!localStorage.getItem(LS_KEYS.ESTUDIO_WIP)) {
        continuaEstudiBtn.disabled = true;
      } else {
        continuaEstudiBtn.disabled = false;
      }
    });


    // Cargar headerTitle dinámicamente desde config.json
    fetch('assets/config.json')
      .then(r => r.json())
      .then(cfg => {
        if (cfg.headerTitle) {
          let title = cfg.headerTitle;
          if (cfg.headerTitleSectionText) {
            let section = '';
            const params = new URLSearchParams(window.location.search);
            if (params.has('section')) {
              section = params.get('section');
            }
            title = title.replace(cfg.headerTitleSectionText, section);
          }
          document.getElementById('headerTitle').textContent = title;
        }
      });

    document.getElementById('testToastBtn').onclick = function() {
      if (window.toast && toast.showToast) {
        toast.showToast('Test Toast OK!');
      } else {
        alert('toast.js no cargado');
      }
    };

    // Borrar el último error del historial
    function continuaEstudi() {
      localStorage.setItem(LS_KEYS.ESTUDIO_WIP_CONTINUE, 'true');
      window.location.href = 'estudiar.html';
    }

    // Borrar el último error del historial
    function logout() {
      localStorage.removeItem(LS_KEYS.USER_NAME);
      localStorage.removeItem(LS_KEYS.USER_PASS);
      window.location.href = 'login.html';
    }

  </script>
