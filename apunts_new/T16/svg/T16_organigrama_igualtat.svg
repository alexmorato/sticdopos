    <text x="160" y="730" class="card-title" fill="#18334a">Comissió de Govern</text>

    <rect x="715" y="665" width="620" height="160" rx="18" fill="#ffffff" stroke="#4b9b78" stroke-width="3"/>
    <rect x="715" y="665" width="12" height="160" rx="6" fill="#4b9b78"/>
    <circle cx="768" cy="720" r="25" fill="#e6f4ec"/>
    <text x="768" y="727" text-anchor="middle" class="number" fill="#287052">4</text>
    <text x="810" y="730" class="card-title" fill="#18334a">Ple Municipal</text>
  </g>

  <circle cx="86" cy="902" r="24" fill="#cf536e"/>
