  <text x="126" y="912" class="section-title" fill="#18334a">ÒRGANS NO POLÍTICS DEL PLA</text>
  <text x="126" y="944" class="section-subtitle" fill="#536779">Seguiment, impuls, diagnosi i avaluació</text>

  <g>
    <rect x="65" y="978" width="620" height="790" rx="22" fill="#ffffff" stroke="#d66b80" stroke-width="3"/>
    <path d="M87 978 H663 Q685 978 685 1000 V1115 H65 V1000 Q65 978 87 978 Z" fill="#d66b80"/>
