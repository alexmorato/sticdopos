    <text x="160" y="1024" class="card-title" fill="#ffffff">Comissió Paritària</text>
    <text x="160" y="1061" class="card-title" fill="#ffffff">de Seguiment</text>
    <text x="102" y="1163" class="label" fill="#a53b56">COMPOSICIÓ</text>
    <text x="102" y="1200" class="body-copy" fill="#253d50">9 representants de l'Administració</text>
    <text x="102" y="1232" class="body-copy" fill="#253d50">+ 9 de la part sindical</text>
    <line x1="102" y1="1260" x2="648" y2="1260" stroke="#e5e9ec" stroke-width="2"/>
    <text x="102" y="1302" class="label" fill="#a53b56">REUNIÓ ORDINÀRIA</text>
    <rect x="102" y="1320" width="230" height="47" rx="12" fill="#f9e8ec"/>
    <text x="217" y="1352" text-anchor="middle" class="body-copy" font-weight="700" fill="#8d2940">Semestral</text>
    <line x1="102" y1="1392" x2="648" y2="1392" stroke="#e5e9ec" stroke-width="2"/>
    <text x="102" y="1434" class="label" fill="#a53b56">FUNCIONS</text>
    <circle cx="112" cy="1474" r="5" fill="#d66b80"/>
    <text x="132" y="1481" class="body-copy" fill="#253d50">Seguiment general del Pla</text>
    <circle cx="112" cy="1520" r="5" fill="#d66b80"/>
    <text x="132" y="1527" class="body-copy" fill="#253d50">Impuls de les mesures</text>
    <circle cx="112" cy="1566" r="5" fill="#d66b80"/>
    <text x="132" y="1573" class="body-copy" fill="#253d50">Avaluació del Pla</text>
    <rect x="102" y="1624" width="546" height="86" rx="14" fill="#f5f7f9"/>
    <text x="124" y="1660" class="label" fill="#536779">CLAU</text>
    <text x="124" y="1692" class="body-copy" fill="#253d50">Representació paritària: 9 + 9</text>

    <rect x="715" y="978" width="620" height="790" rx="22" fill="#ffffff" stroke="#4b9b78" stroke-width="3"/>
    <path d="M737 978 H1313 Q1335 978 1335 1000 V1115 H715 V1000 Q715 978 737 978 Z" fill="#34876b"/>
    <circle cx="766" cy="1032" r="26" fill="#ffffff" fill-opacity=".2"/>
    <text x="766" y="1040" text-anchor="middle" class="number" fill="#ffffff">B</text>
    <text x="810" y="1024" class="card-title" fill="#ffffff">Comissió Tècnica</text>
    <text x="810" y="1061" class="card-title" fill="#ffffff">d'Igualtat</text>
    <text x="752" y="1163" class="label" fill="#287052">COMPOSICIÓ</text>
    <text x="752" y="1200" class="body-copy" fill="#253d50">6 representants de l'Administració</text>
    <text x="752" y="1232" class="body-copy" fill="#253d50">+ 6 de la part sindical</text>
    <line x1="752" y1="1260" x2="1298" y2="1260" stroke="#e5e9ec" stroke-width="2"/>
    <text x="752" y="1302" class="label" fill="#287052">REUNIÓ ORDINÀRIA</text>
    <rect x="752" y="1320" width="230" height="47" rx="12" fill="#e6f4ec"/>
    <text x="867" y="1352" text-anchor="middle" class="body-copy" font-weight="700" fill="#246a50">Mensual</text>
    <line x1="752" y1="1392" x2="1298" y2="1392" stroke="#e5e9ec" stroke-width="2"/>
    <text x="752" y="1434" class="label" fill="#287052">FUNCIONS</text>
    <circle cx="762" cy="1474" r="5" fill="#34876b"/>
    <text x="782" y="1481" class="body-copy" fill="#253d50">Elaboració de la diagnosi</text>
    <circle cx="762" cy="1520" r="5" fill="#34876b"/>
    <text x="782" y="1527" class="body-copy" fill="#253d50">Proposta de mesures</text>
    <circle cx="762" cy="1566" r="5" fill="#34876b"/>
    <text x="782" y="1573" class="body-copy" fill="#253d50">Seguiment i avaluació del Pla</text>
    <rect x="752" y="1624" width="546" height="86" rx="14" fill="#f5f7f9"/>
    <text x="774" y="1660" class="label" fill="#536779">CLAU</text>
    <text x="774" y="1692" class="body-copy" fill="#253d50">Composició paritària: 6 + 6</text>
  </g>

  <rect x="65" y="1810" width="1270" height="140" rx="22" fill="#18334a"/>
  <text x="105" y="1862" class="eyebrow" fill="#9fe3d2">RESUM RÀPID</text>
  <text x="105" y="1910" font-size="27" font-weight="700" fill="#ffffff">4 òrgans polítics</text>
  <circle cx="420" cy="1898" r="6" fill="#eb6077"/>
  <text x="460" y="1910" font-size="27" font-weight="700" fill="#ffffff">2 òrgans del Pla, de seguiment i gestió</text>
</svg>