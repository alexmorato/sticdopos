<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2020" viewBox="0 0 1400 2020" role="img" aria-labelledby="title description">
  <title id="title">Òrgans del III Pla d'Igualtat de l'Ajuntament de Barcelona</title>
  <desc id="description">Infografia dels quatre òrgans polítics principals i dels dos òrgans no polítics del Pla, amb composició, periodicitat i funcions.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
      .main-title { font-size: 66px; font-weight: 800; }
      .subtitle { font-size: 30px; font-weight: 500; }
      .section-title { font-size: 34px; font-weight: 800; }
      .section-subtitle { font-size: 20px; font-weight: 500; }
      .card-title { font-size: 25px; font-weight: 750; }
      .card-copy { font-size: 21px; font-weight: 500; }
      .label { font-size: 17px; font-weight: 800; letter-spacing: .7px; }
      .body-copy { font-size: 20px; font-weight: 500; }
      .number { font-size: 20px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1400" height="2020" fill="#f2f6f7"/>

  <rect x="46" y="42" width="1308" height="250" rx="28" fill="#18334a"/>
  <path d="M46 70 Q46 42 74 42 H92 V292 H74 Q46 292 46 264 Z" fill="#eb6077"/>
  <text x="128" y="99" class="eyebrow" fill="#9fe3d2">AJUNTAMENT DE BARCELONA · 2020-2023</text>
  <text x="128" y="183" class="main-title" fill="#ffffff">III Pla d'Igualtat</text>
  <text x="132" y="239" class="subtitle" fill="#d7e5ed">Òrgans polítics i òrgans del Pla</text>
  <rect x="1090" y="92" width="205" height="118" rx="22" fill="#294d64"/>
  <text x="1192" y="140" text-anchor="middle" class="eyebrow" fill="#ffffff">BARCELONA</text>
  <text x="1192" y="180" text-anchor="middle" font-size="28" font-weight="800" fill="#ffc6d1">2020-2023</text>

  <circle cx="86" cy="360" r="24" fill="#2d7891"/>
  <text x="86" y="367" text-anchor="middle" class="number" fill="#ffffff">01</text>
  <text x="126" y="370" class="section-title" fill="#18334a">ÒRGANS POLÍTICS</text>
  <text x="126" y="402" class="section-subtitle" fill="#536779">Òrgans principals de direcció i representació municipal</text>

  <g>
    <rect x="65" y="435" width="620" height="205" rx="18" fill="#ffffff" stroke="#5d9bb2" stroke-width="3"/>
    <rect x="65" y="435" width="12" height="205" rx="6" fill="#5d9bb2"/>
    <circle cx="118" cy="488" r="25" fill="#e0f1f5"/>
    <text x="118" y="495" text-anchor="middle" class="number" fill="#22647d">1</text>
    <text x="160" y="486" class="card-title" fill="#18334a">4a Tinència d'Alcaldia</text>
    <text x="160" y="525" class="card-copy" fill="#3e5364">Drets Socials, Justícia Global,</text>
    <text x="160" y="557" class="card-copy" fill="#3e5364">Feminismes i LGBTI</text>

    <rect x="715" y="435" width="620" height="205" rx="18" fill="#ffffff" stroke="#e98a67" stroke-width="3"/>
    <rect x="715" y="435" width="12" height="205" rx="6" fill="#e98a67"/>
    <circle cx="768" cy="488" r="25" fill="#fff0e8"/>
    <text x="768" y="495" text-anchor="middle" class="number" fill="#a44d35">2</text>
    <text x="810" y="482" class="card-title" fill="#18334a">Regidoria de Comerç,</text>
    <text x="810" y="520" class="card-title" fill="#18334a">Mercats, Règim Intern</text>
    <text x="810" y="558" class="card-title" fill="#18334a">i Hisenda</text>

    <rect x="65" y="665" width="620" height="160" rx="18" fill="#ffffff" stroke="#8a79ba" stroke-width="3"/>
    <rect x="65" y="665" width="12" height="160" rx="6" fill="#8a79ba"/>
    <circle cx="118" cy="720" r="25" fill="#eeeafb"/>
