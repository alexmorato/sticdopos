<!DOCTYPE html>
<html lang="ca">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tema 2 - Resum visual</title>
	<style>
		:root {
			color-scheme: light;
			--page-bg: #f6f4ef;
			--panel-bg: #ffffff;
			--panel-border: #d9d4c7;
			--text-main: #1f1f1c;
			--text-muted: #5d5a52;
			--shadow: 0 18px 48px rgba(53, 47, 33, 0.12);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: Georgia, "Times New Roman", serif;
			background:
				radial-gradient(circle at top, rgba(200, 181, 138, 0.18), transparent 32%),
				linear-gradient(180deg, #fbfaf7 0%, var(--page-bg) 100%);
			color: var(--text-main);
		}

		main {
			width: min(1100px, calc(100vw - 32px));
			margin: 0 auto;
			padding: 32px 0 48px;
		}

		.hero {
			margin-bottom: 24px;
			text-align: center;
		}

		.hero h1 {
			margin: 0 0 8px;
			font-size: clamp(1.9rem, 3vw, 2.6rem);
			letter-spacing: 0.02em;
		}

		.hero p {
			margin: 0;
			color: var(--text-muted);
			font-size: 1rem;
		}

		.visual-card {
			padding: 18px;
			border: 1px solid var(--panel-border);
			border-radius: 24px;
			background: var(--panel-bg);
			box-shadow: var(--shadow);
			overflow: hidden;
		}

		.visual-card svg {
			display: block;
			width: 100%;
			height: auto;
		}
	</style>
</head>
<body>
	<main>
		<section class="hero">
			<h1>Tema 2 - El Govern</h1>
			<p>Resum visual del sistema constitucional espanyol.</p>
		</section>

						.c-gray text { fill: #2C2C2A; }

						.c-blue rect { fill: #E6F1FB; stroke: #378ADD; }
						.c-blue text { fill: #042C53; }

						.neutral-row rect { fill: none; stroke: #cccccc; stroke-width: 0.5; }
						.neutral-row text { fill: #333333; }

						svg { background: #ffffff; }
