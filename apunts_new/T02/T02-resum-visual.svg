<svg width="100%" viewBox="0 0 680 980" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Resum Tema 2 — El Govern en el sistema constitucional espanyol</title>
  <desc>Diagrama resum dels 6 blocs del Tema 2: composició, estatut dels membres, mecanismes de control parlamentari i dades clau per memoritzar.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #1a1a1a; }
      .th { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .ts { font-size: 11px; font-weight: 400; fill: #3a3a3a; }

      /* Purple */
      .c-purple rect { fill: #EEEDFE; stroke: #7F77DD; }
      .c-purple text { fill: #3C3489; }

      /* Teal */
      .c-teal rect { fill: #E1F5EE; stroke: #1D9E75; }
      .c-teal text { fill: #085041; }

      /* Amber */
      .c-amber rect { fill: #FAEEDA; stroke: #BA7517; }
      .c-amber text { fill: #633806; }

      /* Coral */
      .c-coral rect { fill: #FAECE7; stroke: #D85A30; }
      .c-coral text { fill: #4A1B0C; }

      /* Gray */
      .c-gray rect { fill: #F1EFE8; stroke: #888780; }
      .c-gray text { fill: #2C2C2A; }

      /* Blue */
      .c-blue rect { fill: #E6F1FB; stroke: #378ADD; }
      .c-blue text { fill: #042C53; }

      /* Neutral borders */
      .neutral-row rect { fill: none; stroke: #cccccc; stroke-width: 0.5; }
      .neutral-row text { fill: #333333; }

      svg { background: #ffffff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="980" fill="#ffffff"/>

  <!-- TÍTOL -->
  <text class="th" x="340" y="32" text-anchor="middle" font-size="15" fill="#1a1a1a">Tema 2 — El Govern: resum per memoritzar</text>

  <!-- ===== BLOC 1: COMPOSICIÓ ===== -->
  <g class="c-purple">
    <rect x="30" y="50" width="620" height="36" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="72" text-anchor="middle">Bloc 1 · Composició del Govern (art. 98 CE + Llei 50/1997)</text>
  </g>

  <g class="c-purple">
    <rect x="30" y="96" width="136" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="98" y="116" text-anchor="middle">President</text>
    <text class="ts" x="98" y="134" text-anchor="middle">Obligatori</text>
  </g>
  <g class="c-purple">
    <rect x="178" y="96" width="136" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="246" y="116" text-anchor="middle">Vicepresident/s</text>
    <text class="ts" x="246" y="134" text-anchor="middle">Potestatiu</text>
  </g>
  <g class="c-purple">
    <rect x="326" y="96" width="136" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="394" y="116" text-anchor="middle">Ministres</text>
    <text class="ts" x="394" y="134" text-anchor="middle">Obligatoris</text>
  </g>
  <g class="c-purple">
    <rect x="474" y="96" width="176" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="562" y="116" text-anchor="middle">Altres (llei)</text>
    <text class="ts" x="562" y="134" text-anchor="middle">Sec. Estat (no membres)</text>
  </g>

  <!-- Cessació -->
  <g class="c-gray">
    <rect x="30" y="158" width="620" height="44" rx="6" stroke-width="0.5"/>
    <text class="th" x="340" y="175" text-anchor="middle">Cessació del Govern (art. 101 CE)</text>
    <text class="ts" x="340" y="193" text-anchor="middle">Eleccions · Moció de censura aprovada · Qüestió de confiança denegada · Dimissió/defunció President</text>
  </g>

  <!-- ===== BLOC 2+3+4: ESTATUT MEMBRES ===== -->
  <g class="c-teal">
    <rect x="30" y="214" width="620" height="36" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="236" text-anchor="middle">Blocs 2·3·4 — Estatut dels membres: dades clau</text>
  </g>

  <!-- Capçalera taula -->
  <g class="c-teal">
    <rect x="30" y="260" width="140" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="100" y="279" text-anchor="middle">Membre</text>
  </g>
  <g class="c-teal">
    <rect x="174" y="260" width="150" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="249" y="279" text-anchor="middle">Nomenament</text>
  </g>
  <g class="c-teal">
    <rect x="328" y="260" width="150" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="403" y="279" text-anchor="middle">Cessament</text>
  </g>
  <g class="c-teal">
    <rect x="482" y="260" width="168" height="30" rx="4" stroke-width="0.5"/>
    <text class="th" x="566" y="279" text-anchor="middle">Aforament</text>
  </g>

  <!-- Fila President -->
  <g class="neutral-row">
    <rect x="30" y="294" width="140" height="34" rx="4"/>
    <text class="ts" x="100" y="315" text-anchor="middle" fill="#333">President</text>
  </g>
  <g class="neutral-row">
    <rect x="174" y="294" width="150" height="34" rx="4"/>
    <text class="ts" x="249" y="315" text-anchor="middle" fill="#333">Investidura (Congrés) + Rei</text>
  </g>
  <g class="neutral-row">
    <rect x="328" y="294" width="150" height="34" rx="4"/>
    <text class="ts" x="403" y="315" text-anchor="middle" fill="#333">Art. 101 CE</text>
  </g>
  <g class="neutral-row">
    <rect x="482" y="294" width="168" height="34" rx="4"/>
    <text class="ts" x="566" y="315" text-anchor="middle" fill="#333">Sala Penal TS</text>
  </g>

  <!-- Fila Vicepresident -->
  <g class="neutral-row">
    <rect x="30" y="332" width="140" height="34" rx="4"/>
    <text class="ts" x="100" y="353" text-anchor="middle" fill="#333">Vicepresident</text>
  </g>
  <g class="neutral-row">
    <rect x="174" y="332" width="150" height="34" rx="4"/>
    <text class="ts" x="249" y="353" text-anchor="middle" fill="#333">RD del President</text>
  </g>
  <g class="neutral-row">
    <rect x="328" y="332" width="150" height="34" rx="4"/>
    <text class="ts" x="403" y="353" text-anchor="middle" fill="#333">President (lliure) + 101 CE</text>
  </g>
  <g class="neutral-row">
    <rect x="482" y="332" width="168" height="34" rx="4"/>
    <text class="ts" x="566" y="353" text-anchor="middle" fill="#333">Sala Penal TS</text>
  </g>

  <!-- Fila Ministres -->
  <g class="neutral-row">
    <rect x="30" y="370" width="140" height="34" rx="4"/>
    <text class="ts" x="100" y="391" text-anchor="middle" fill="#333">Ministres</text>
  </g>
  <g class="neutral-row">
    <rect x="174" y="370" width="150" height="34" rx="4"/>
    <text class="ts" x="249" y="391" text-anchor="middle" fill="#333">RD Rei (prop. President)</text>
  </g>
  <g class="neutral-row">
    <rect x="328" y="370" width="150" height="34" rx="4"/>
    <text class="ts" x="403" y="391" text-anchor="middle" fill="#333">President (lliure) + 101 CE</text>
  </g>
  <g class="neutral-row">
    <rect x="482" y="370" width="168" height="34" rx="4"/>
    <text class="ts" x="566" y="391" text-anchor="middle" fill="#333">Sala Penal TS</text>
  </g>

  <!-- Incompatibilitats -->
  <g class="c-gray">
    <rect x="30" y="414" width="620" height="34" rx="6" stroke-width="0.5"/>
    <text class="th" x="340" y="430" text-anchor="middle">Tots els membres: incompatibles amb qualsevol altre càrrec públic i activitats privades</text>
    <text class="ts" x="340" y="444" text-anchor="middle">Porta giratòria: 2 anys de restricció post-cessament per als Ministres (Llei 3/2015)</text>
  </g>

  <!-- ===== BLOC 5: CONSELL D'ESTAT ===== -->
  <g class="c-amber">
    <rect x="30" y="460" width="620" height="36" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="482" text-anchor="middle">Bloc 5 · Consell d'Estat (art. 107 CE · LO 3/1980)</text>
  </g>

  <g class="c-amber">
    <rect x="30" y="506" width="130" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="95" y="526" text-anchor="middle">Naturalesa</text>
    <text class="ts" x="95" y="544" text-anchor="middle">Màxim òrgan</text>
    <text class="ts" x="95" y="556" text-anchor="middle">consultiu</text>
  </g>
  <g class="c-amber">
    <rect x="172" y="506" width="150" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="247" y="523" text-anchor="middle">Membres clau</text>
    <text class="ts" x="247" y="539" text-anchor="middle">President + Permanents</text>
    <text class="ts" x="247" y="553" text-anchor="middle">Nats + Electius (4a)</text>
  </g>
  <g class="c-amber">
    <rect x="334" y="506" width="150" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="409" y="523" text-anchor="middle">Dictàmens</text>
    <text class="ts" x="409" y="539" text-anchor="middle">Preceptius (obligatoris)</text>
    <text class="ts" x="409" y="553" text-anchor="middle">Facultatius (voluntaris)</text>
  </g>
  <g class="c-amber">
    <rect x="496" y="506" width="154" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="573" y="523" text-anchor="middle">Vinculació</text>
    <text class="ts" x="573" y="539" text-anchor="middle">En general</text>
    <text class="ts" x="573" y="553" text-anchor="middle">NO vinculants</text>
  </g>

  <!-- ===== BLOC 6: CONTROL PARLAMENTARI ===== -->
  <g class="c-coral">
    <rect x="30" y="572" width="620" height="36" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="594" text-anchor="middle">Bloc 6 · Control parlamentari — CLAU PER A L'EXAMEN</text>
  </g>

  <g class="c-gray">
    <rect x="30" y="618" width="620" height="26" rx="6" stroke-width="0.5"/>
    <text class="th" x="340" y="635" text-anchor="middle">A) Control ordinari — no derroquen el Govern</text>
  </g>

  <g class="c-gray">
    <rect x="30" y="652" width="142" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="101" y="672" text-anchor="middle">Preguntes</text>
    <text class="ts" x="101" y="688" text-anchor="middle">Orals / Escrites</text>
    <text class="ts" x="101" y="700" text-anchor="middle">En comissió</text>
  </g>
  <g class="c-gray">
    <rect x="182" y="652" width="142" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="253" y="672" text-anchor="middle">Interpel·lacions</text>
    <text class="ts" x="253" y="688" text-anchor="middle">Política general</text>
    <text class="ts" x="253" y="700" text-anchor="middle">Poden generar moció</text>
  </g>
  <g class="c-gray">
    <rect x="334" y="652" width="142" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="405" y="672" text-anchor="middle">Compareixences</text>
    <text class="ts" x="405" y="688" text-anchor="middle">Ple i Comissions</text>
    <text class="ts" x="405" y="700" text-anchor="middle">A petició pròpia/càmera</text>
  </g>
  <g class="c-gray">
    <rect x="486" y="652" width="164" height="52" rx="6" stroke-width="0.5"/>
    <text class="th" x="568" y="672" text-anchor="middle">Comissions invest.</text>
    <text class="ts" x="568" y="688" text-anchor="middle">No vinculants juríd.</text>
    <text class="ts" x="568" y="700" text-anchor="middle">Impacte polític</text>
  </g>

  <g class="c-coral">
    <rect x="30" y="714" width="620" height="26" rx="6" stroke-width="0.5"/>
    <text class="th" x="340" y="731" text-anchor="middle">B) Control directe — poden derrocar el Govern</text>
  </g>

  <!-- Qüestió de confiança -->
  <g class="c-blue">
    <rect x="30" y="748" width="290" height="110" rx="8" stroke-width="0.5"/>
    <text class="th" x="175" y="770" text-anchor="middle">Qüestió de confiança (art. 112 CE)</text>
    <text class="ts" x="175" y="788" text-anchor="middle">Iniciativa: PRESIDENT del Govern</text>
    <text class="ts" x="175" y="804" text-anchor="middle">Davant: Congrés dels Diputats</text>
    <text class="ts" x="175" y="820" text-anchor="middle">Majoria: SIMPLE (més síns que nons)</text>
    <text class="ts" x="175" y="836" text-anchor="middle">Si es denega: cessació del Govern</text>
    <text class="ts" x="175" y="852" text-anchor="middle">Efecte: reforç o cessació</text>
  </g>

  <!-- Moció de censura -->
  <g class="c-coral">
    <rect x="360" y="748" width="290" height="110" rx="8" stroke-width="0.5"/>
    <text class="th" x="505" y="770" text-anchor="middle">Moció de censura (art. 113 CE)</text>
    <text class="ts" x="505" y="788" text-anchor="middle">Iniciativa: CONGRÉS (1/10 = 35 diputats)</text>
    <text class="ts" x="505" y="804" text-anchor="middle">Caràcter: CONSTRUCTIVA (candidat alt.)</text>
    <text class="ts" x="505" y="820" text-anchor="middle">Majoria: ABSOLUTA (176 de 350)</text>
    <text class="ts" x="505" y="836" text-anchor="middle">Termini: no votar fins 5 dies</text>
    <text class="ts" x="505" y="852" text-anchor="middle">Prospera: nou President investit</text>
  </g>

  <!-- Mocions història -->
  <g class="c-gray">
    <rect x="30" y="868" width="620" height="44" rx="6" stroke-width="0.5"/>
    <text class="th" x="340" y="885" text-anchor="middle">Mocions de censura a Espanya</text>
    <text class="ts" x="340" y="903" text-anchor="middle">1980 González vs Suárez: NO prospera · 1987 H. Mancha vs González: NO prospera · 2018 Sánchez vs Rajoy: PROSPERA (1a de la història)</text>
  </g>

  <!-- Responsabilitat -->
  <g class="c-purple">
    <rect x="30" y="922" width="620" height="44" rx="6" stroke-width="0.5"/>
    <text class="th" x="340" y="940" text-anchor="middle">Responsabilitat política: art. 108 CE</text>
    <text class="ts" x="340" y="957" text-anchor="middle">El Govern respon SOLIDÀRIAMENT davant el CONGRÉS · El Senat controla però NO pot derrocar el Govern</text>
  </g>
</svg>