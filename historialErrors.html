  <script>
    if (typeof showLoadingSpinner === 'function') showLoadingSpinner('Carregant historial...');

    // Variables globales
    let historialFallos = [];
    let historialFallosFiltradosURL = null; // Historial filtrado por URL params (null = sin filtros URL)
    let temasFiltrados = [];
    let ordenarPor = 'fecha'; // 'fecha' o 'count'
    const preguntesContainer = document.getElementById('preguntesContainer');
    const modal = document.getElementById('detailModal');
    const closeModal = document.getElementsByClassName('close')[0];

    // Referencias al menú hamburguesa
    const menuBtn = document.getElementById('menuBtn');
    const menuPanel = document.getElementById('menuPanel');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const menuFullscreenBtn = document.getElementById('menuFullscreenBtn');
    const menuIndexBtn = document.getElementById('menuIndexBtn');
    const menuRepassarBtn = document.getElementById('menuRepassarBtn');
    const menuCopiarBtn = document.getElementById('menuCopiarBtn');
    const menuDescargarBtn = document.getElementById('menuDescargarBtn');
    const menuEsborrarBtn = document.getElementById('menuEsborrarBtn');

    // Toggle menú
    menuBtn.addEventListener('click', () => {
      menuPanel.classList.toggle('visible');
    });

    // Cerrar menú
    menuCloseBtn.addEventListener('click', () => {
      menuPanel.classList.remove('visible');
    });

    let cerrarMenuAlClickFuera = false;
    // Cerrar menú al hacer clic fuera
    document.addEventListener('click', (e) => {
      if (!cerrarMenuAlClickFuera) return;

      if (!menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
        menuPanel.classList.remove('visible');
      }
    });


    // Botón fullscreen
    menuFullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          menuFullscreenBtn.innerHTML = '⛶ Sortir pantalla completa';
          menuPanel.classList.remove('visible');
        }).catch(err => {
          console.error('Error al activar fullscreen:', err);
        });
      } else {
        document.exitFullscreen().then(() => {
          menuFullscreenBtn.innerHTML = '⛶ Pantalla completa';
          menuPanel.classList.remove('visible');
        });
      }
    });

    // Actualizar texto del botón cuando se sale de fullscreen con ESC
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        menuFullscreenBtn.innerHTML = '⛶ Pantalla completa';
      }
    });

    // Botón menu principal
    menuIndexBtn.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // Botón volver arriba
    document.getElementById('scrollTopBtn').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    // Modal para seleccionar múltiples temas
    function showFiltrarTemaModal() {
      if (document.getElementById('filtrarTemaModal')) return;
      // Obtener todos los subjectId únicos del historial
      const temasUnicos = Array.from(new Set(historialFallos.map(p => p.subjectId).filter(Boolean)));
      // Obtener los seleccionados actualmente
      let seleccionados = temasFiltrados;
      const modal = document.createElement('div');
      modal.id = 'filtrarTemaModal';
      modal.className = 'custom-modal-bg';
      modal.innerHTML = `
        <div class="custom-modal">
          <div class="custom-modal-title">Selecciona temes per filtrar</div>
          <div id="temaBtns" class="custom-modal-btns"></div>
          <div class="custom-modal-actions">
            <button id="temaAceptarBtn" class="custom-modal-accept">Aceptar</button>
            <button id="temaCancelarBtn" class="custom-modal-cancel">Cancelar</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      // Botones de tema
      const btnsDiv = modal.querySelector('#temaBtns');
      temasUnicos.forEach(tema => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = tema;
        btn.value = tema;
        btn.className = 'dif-btn';
        if (seleccionados.includes(tema)) btn.classList.add('selected');
        btn.addEventListener('click', function() {
          btn.classList.toggle('selected');
        });
        btnsDiv.appendChild(btn);
      });
      // Botón aceptar
      modal.querySelector('#temaAceptarBtn').onclick = function() {
        temasFiltrados = Array.from(btnsDiv.querySelectorAll('button.selected')).map(b => b.value);
        document.body.removeChild(modal);
        renderizarPreguntes(); // Aplicar filtro inmediatamente
      };
      // Botón cancelar
      modal.querySelector('#temaCancelarBtn').onclick = function() {
        document.body.removeChild(modal);
      };
    }
  // Abrir modal al hacer click en el botón
  document.getElementById('filtrarTemaBtn').addEventListener('click', showFiltrarTemaModal);

  // Event listener para el selector de ordenación
  document.getElementById('ordenarSelect').addEventListener('change', function(e) {
    ordenarPor = e.target.value;
    renderizarPreguntes();
  });

    // Cargar historial del localStorage
    function cargarHistorial() {
      try {
        const historialStr = localStorage.getItem(LS_KEYS.HISTORIAL_FALLOS);
        historialFallos = historialStr ? JSON.parse(historialStr) : [];
        
        // Aplicar filtros de URL si existen
        aplicarFiltrosURL();
      } catch (e) {
        console.error('Error al cargar historial:', e);
        historialFallos = [];
      }
      actualizarUI();
    }

    // Aplicar filtros desde URL params
    function aplicarFiltrosURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const subjectIdParam = urlParams.get('subjectid');
      const questionParam = urlParams.get('question');

      // Si no hay parámetros, usar historial completo
      if (!subjectIdParam && !questionParam) {
        historialFallosFiltradosURL = null;
        return;
      }

      // Convertir parámetros en arrays de palabras (dividir por espacios)
      const subjectIdWords = subjectIdParam ? subjectIdParam.toLowerCase().split(/\s+/).filter(Boolean) : [];
      const questionWords = questionParam ? questionParam.toLowerCase().split(/\s+/).filter(Boolean) : [];

      // Filtrar preguntas
      historialFallosFiltradosURL = historialFallos.filter(pregunta => {
        let coincide = false;

        // Verificar coincidencias en subjectId
        if (subjectIdWords.length > 0) {
          const subjectId = (pregunta.subjectId || '').toLowerCase();
          coincide = subjectIdWords.some(word => subjectId.includes(word));
        }

        // Verificar coincidencias en question/pregunta
        if (questionWords.length > 0) {
          const questionText = ((pregunta.question || pregunta.pregunta) || '').toLowerCase();
          const coincideQuestion = questionWords.some(word => questionText.includes(word));
          
          // Si había filtro de subjectId, usar OR, si no, usar el resultado de question
          coincide = subjectIdWords.length > 0 ? (coincide || coincideQuestion) : coincideQuestion;
        }

        return coincide;
      });

      // Si hay filtros aplicados, mostrar toast informativo
      if (historialFallosFiltradosURL.length > 0) {
        const filtrosAplicados = [];
        if (subjectIdParam) filtrosAplicados.push(`SubjectId: "${subjectIdParam}"`);
        if (questionParam) filtrosAplicados.push(`Question: "${questionParam}"`);
        
        setTimeout(() => {
          if (window.toast && typeof window.toast.showToast === 'function') {
            toast.showToast(`🔍 Filtre URL: ${historialFallosFiltradosURL.length} pregunta${historialFallosFiltradosURL.length > 1 ? 's' : ''} trobada${historialFallosFiltradosURL.length > 1 ? 's' : ''}`);
          }
        }, 500);
      } else {
        // No hay coincidencias con los filtros
        setTimeout(() => {
          if (window.toast && typeof window.toast.showToast === 'function') {
            toast.showToast(`⚠️ No hi ha coincidències amb els filtres introduïts. Prova de canviar els paràmetres de cerca.`, 5000);
          }
        }, 500);
      }
    }

    // Actualizar interfaz de usuario
    function actualizarUI() {
      // Actualizar estadísticas
      document.getElementById('totalPreguntes').textContent = historialFallos.length;
      
      if (historialFallos.length > 0) {
        // Encontrar la fecha más reciente
        const fechas = historialFallos
          .filter(p => p.fecha)
          .map(p => new Date(p.fecha))
          .sort((a, b) => b - a);
        
        if (fechas.length > 0) {
          const ultimaFecha = fechas[0];
          document.getElementById('ultimaActualizacion').textContent = 
            ultimaFecha.toLocaleDateString('ca-ES') + ' ' + ultimaFecha.toLocaleTimeString('ca-ES', {hour: '2-digit', minute: '2-digit'});
        } else {
          document.getElementById('ultimaActualizacion').textContent = '-';
        }

        // Mostrar botones del menú
        menuRepassarBtn.style.display = 'block';
        menuCopiarBtn.style.display = 'block';
        menuDescargarBtn.style.display = 'block';
        menuEsborrarBtn.style.display = 'block';

        // Renderizar preguntas
        renderizarPreguntes();
      } else {
        document.getElementById('ultimaActualizacion').textContent = '-';
        menuRepassarBtn.style.display = 'none';
        menuCopiarBtn.style.display = 'none';
        menuDescargarBtn.style.display = 'none';
        menuEsborrarBtn.style.display = 'none';
        preguntesContainer.innerHTML = '<div class="empty-state">No hi ha preguntes a l\'historial de fallos.</div>';
      }

      if (typeof hideLoadingSpinner === 'function') hideLoadingSpinner();
    }

    // Renderizar lista de preguntas
    function renderizarPreguntes() {
      preguntesContainer.innerHTML = '';
      
      // Determinar qué historial usar: filtrado por URL o completo
      let preguntasAMostrar = historialFallosFiltradosURL !== null ? historialFallosFiltradosURL : historialFallos;
      
      // Aplicar filtro de temas si existe
      if (temasFiltrados.length > 0) {
        preguntasAMostrar = preguntasAMostrar.filter(p => temasFiltrados.includes(p.subjectId));
      }

      // Si no hay preguntas para mostrar después de aplicar filtros
      if (preguntasAMostrar.length === 0) {
        preguntesContainer.innerHTML = '<div class="empty-state">No hi ha preguntes que coincideixin amb els filtres aplicats.</div>';
        return;
      }

      // Ordenar según criterio seleccionado
      preguntasAMostrar = [...preguntasAMostrar]; // Crear copia para no modificar el original
      if (ordenarPor === 'fecha') {
        preguntasAMostrar.sort((a, b) => {
          const fechaA = a.fecha ? new Date(a.fecha) : new Date(0);
          const fechaB = b.fecha ? new Date(b.fecha) : new Date(0);
          return fechaB - fechaA; // Descendente (más reciente primero)
        });
      } else if (ordenarPor === 'count') {
        preguntasAMostrar.sort((a, b) => {
          const countA = a.count || 1;
          const countB = b.count || 1;
          return countB - countA; // Descendente (mayor count primero)
        });
      }
      preguntasAMostrar.forEach((pregunta, index) => {
        const card = document.createElement('div');
        card.className = 'pregunta-card';
        card.dataset.guid = pregunta.guid; // Guardar guid en lugar de index
        const questionText = pregunta.question || pregunta.pregunta || 'Pregunta sense text';
        const subjectId = pregunta.subjectId || '-';
        const difficulty = pregunta.difficulty || '-';
        const origin = pregunta.origin || '-';
        const fecha = pregunta.fecha ? new Date(pregunta.fecha) : null;
        const count = pregunta.count || 1;
        // Crear resumen truncado de la pregunta
        const maxLength = 150;
        const resumen = questionText.length > maxLength 
          ? questionText.substring(0, maxLength) + '...' 
          : questionText;
        card.innerHTML = `
          <div class="pregunta-header">
            <div class="pregunta-info">
              <div class="pregunta-text">${resumen}</div>
              <div class="pregunta-meta">
                <div class="meta-item">
                  <span class="meta-label">Tema:</span>
                  <span>${subjectId}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Dificultat:</span>
                  <span>${difficulty}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Origen:</span>
                  <span>${origin}</span>
                </div>
                ${fecha ? ` 
                <div class="meta-item">
                  <span class="meta-label">Data:</span>
                  <span>${fecha.toLocaleDateString('ca-ES')}</span>
                </div>
                ` : ''}
                <div class="meta-item">
                  <span class="meta-label">Count:</span>
                  <span>${count}</span>
                </div>
              </div>
            </div>
            <div class="pregunta-actions">
              <button class="btn btn-detail" data-guid="${pregunta.guid}">👁️</button>
              <button class="btn btn-delete" data-guid="${pregunta.guid}">🗑️</button>
            </div>
          </div>
        `;

        // Selección visual y lógica
        card.addEventListener('click', function(e) {
          // Evitar seleccionar al hacer click en los botones internos
          if (e.target.closest('.pregunta-actions')) return;
          card.classList.toggle('selected');
        });

        // Si hay temas filtrados o filtros URL, marcar como seleccionada
        if (temasFiltrados.length > 0 || (historialFallosFiltradosURL !== null && historialFallosFiltradosURL.length > 0)) {
          card.classList.add('selected');
        }

        preguntesContainer.appendChild(card);
      });

      // Añadir event listeners a los botones
      document.querySelectorAll('.btn-detail').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const guid = e.target.dataset.guid;
          mostrarDetalle(guid);
        });
      });

      document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const guid = e.target.dataset.guid;
          borrarPregunta(guid);
        });
      });

      // Actualizar texto de los botones según selección
      actualizarBotonesSegunSeleccion();

      // Añadir event listener para actualizar el texto al seleccionar/deseleccionar
      document.querySelectorAll('.pregunta-card').forEach(card => {
        card.addEventListener('click', function(e) {
          if (e.target.closest('.pregunta-actions')) return;
          setTimeout(actualizarBotonesSegunSeleccion, 0);
        });
      });

      // Actualiza el texto de los botones según la selección
      function actualizarBotonesSegunSeleccion() {
        const btnCopiar = menuCopiarBtn;
        const btnDescargar = menuDescargarBtn;
        const btnRepassar = menuRepassarBtn;
        const btnBorrar = menuEsborrarBtn;
        const seleccionadas = document.querySelectorAll('.pregunta-card.selected').length;
        const total = historialFallos.length;
        if (btnCopiar) {
          if (seleccionadas === 0) {
            btnCopiar.textContent = '📋 Copiar Historial';
          } else {
            btnCopiar.textContent = `📋 Copiar ${seleccionadas} de ${total}`;
          }
        }
        if (btnDescargar) {
          if (seleccionadas === 0) {
            btnDescargar.textContent = '💾 Descargar Historial';
          } else {
            btnDescargar.textContent = `💾 Descargar ${seleccionadas} de ${total}`;
          }
        }
        if (btnRepassar) {
          if (seleccionadas === 0) {
            btnRepassar.textContent = '🔁 Repassar Historial';
          } else {
            btnRepassar.textContent = `🔁 Repassar ${seleccionadas} de ${total}`;
          }
        }
        if (btnBorrar) {
          if (seleccionadas === 0) {
            btnBorrar.textContent = '🗑️ Esborrar Tot';
          } else {
            btnBorrar.textContent = `🗑️ Esborrar ${seleccionadas} de ${total}`;
          }
        }
      }
    }

    // Mostrar detalle en modal
    function mostrarDetalle(guid) {
      const pregunta = historialFallos.find(p => p.guid === guid);
      if (!pregunta) return;

      const questionText = pregunta.question || pregunta.pregunta || 'Pregunta sense text';
      document.getElementById('modalTitle').textContent = questionText;

      // Meta información
      const metaHTML = `
        <div class="meta-item">
          <span class="meta-label">Tema:</span>
          <span>${pregunta.subjectId || '-'}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Tipus:</span>
          <span>${pregunta.type || '-'}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Dificultat:</span>
          <span>${pregunta.difficulty || '-'}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Origen:</span>
          <span>${pregunta.origin || '-'}</span>
        </div>
      `;
      document.getElementById('modalMeta').innerHTML = metaHTML;

      // Respuestas
      const answersHTML = (pregunta.answerOptions || []).map((option) => {
        const isCorrect = option.isCorrect || false;
        const isSelected = option.selectedByUser || false;
        let classes = 'answer-option';
        let badges = '';
        
        if (isCorrect) {
          classes += ' correct';
          badges += '<span class="answer-badge badge-correct">✓ CORRECTA</span>';
        }
        if (isSelected) {
          classes += ' selected';
          badges += '<span class="answer-badge badge-selected">Seleccionada</span>';
        }

        const rationale = option.rationale || option.raonationale || '';

        return `
          <div class="${classes}">
            <div>
              ${option.text || option.resposta || '-'}
              ${badges}
            </div>
            ${rationale ? `<div class="answer-rationale">${rationale}</div>` : ''}
          </div>
        `;
      }).join('');
      document.getElementById('modalAnswers').innerHTML = answersHTML || '<p>No hi ha opcions de resposta.</p>';

      // Pista
      const hint = pregunta.hint || pregunta.pista || '';
      if (hint) {
        document.getElementById('modalHint').textContent = hint;
        document.getElementById('modalHintSection').style.display = 'block';
      } else {
        document.getElementById('modalHintSection').style.display = 'none';
      }

      modal.style.display = 'block';
    }

    // Borrar pregunta
    function borrarPregunta(guid) {
      if (confirm('Segur que vols esborrar aquesta pregunta de l\'historial?')) {
        const index = historialFallos.findIndex(p => p.guid === guid);
        if (index !== -1) {
          historialFallos.splice(index, 1);
          guardarHistorial();
          actualizarUI();
        }
      }
    }

    // Guardar historial en localStorage
    function guardarHistorial() {
      try {
        localStorage.setItem(LS_KEYS.HISTORIAL_FALLOS, JSON.stringify(historialFallos));
      } catch (e) {
        console.error('Error al guardar historial:', e);
        alert('Error al guardar els canvis');
      }
    }

    // Cerrar modal
    closeModal.onclick = function() {
      modal.style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = 'none';
      }
    }

    // Conectar botones del menú a las acciones
    menuRepassarBtn.addEventListener('click', () => {
      menuPanel.classList.remove('visible');
      repassarAction();
    });

    menuCopiarBtn.addEventListener('click', () => {
      menuPanel.classList.remove('visible');
      copiarAction();
    });

    menuDescargarBtn.addEventListener('click', () => {
      menuPanel.classList.remove('visible');
      descargarAction();
    });

    menuEsborrarBtn.addEventListener('click', () => {
      menuPanel.classList.remove('visible');
      esborrarAction();
    });

    function repassarAction() {
      if (historialFallos.length > 0) {
        // Obtener las seleccionadas
        const selectedCards = Array.from(document.querySelectorAll('.pregunta-card.selected'));
        let preguntasAEstudiar = [];
        if (selectedCards.length > 0) {
          preguntasAEstudiar = selectedCards.map(card => {
            const guid = card.dataset.guid;
            return historialFallos.find(p => p.guid === guid);
          }).filter(p => p !== undefined);
        } else {
          preguntasAEstudiar = historialFallos;
        }
        // Limpiar estado anterior
        if (typeof borrarEstudioEnProgreso === 'function') borrarEstudioEnProgreso();

        // Guardar las preguntas a estudiar
        localStorage.setItem(LS_KEYS.PREGUNTES, JSON.stringify(preguntasAEstudiar));
        localStorage.setItem(LS_KEYS.REPASAR_FALLOS, "true");

        // Navegar a estudiar
        window.location.href = 'estudiar.html';
      }
    }

    // Funciones de acción
    function copiarAction() {
      // Copiar solo las preguntas seleccionadas
      const selectedCards = Array.from(document.querySelectorAll('.pregunta-card.selected'));
      let preguntasSeleccionadas = [];
      if (selectedCards.length > 0) {
        preguntasSeleccionadas = selectedCards.map(card => {
          const guid = card.dataset.guid;
          return historialFallos.find(p => p.guid === guid);
        }).filter(p => p !== undefined);
      } else {
        preguntasSeleccionadas = historialFallos;
      }
      if (preguntasSeleccionadas.length > 0) {
        const jsonStr = JSON.stringify(preguntasSeleccionadas, null, 2);
        navigator.clipboard.writeText(jsonStr).then(() => {
          if (window.toast && typeof window.toast.showToast === 'function') {
            toast.showToast('Copiat al portapapers!');
          }
        }).catch(err => {
          console.error('Error al copiar:', err);
          if (window.toast && typeof window.toast.showToast === 'function') {
            toast.showToast('No s\'ha pogut copiar al portapapers');
          } else {
            alert('No s\'ha pogut copiar al portapapers');
          }
        });
      }
    }

    function descargarAction() {
      // Descargar solo las preguntas seleccionadas
      const selectedCards = Array.from(document.querySelectorAll('.pregunta-card.selected'));
      let preguntasSeleccionadas = [];
      if (selectedCards.length > 0) {
        preguntasSeleccionadas = selectedCards.map(card => {
          const guid = card.dataset.guid;
          return historialFallos.find(p => p.guid === guid);
        }).filter(p => p !== undefined);
      } else {
        preguntasSeleccionadas = historialFallos;
      }
      if (preguntasSeleccionadas.length > 0) {
        const jsonStr = JSON.stringify(preguntasSeleccionadas, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
        const username = localStorage.getItem(LS_KEYS.USER_NAME);

        a.download = `historial-${username}-${timestamp}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        if (window.toast && typeof window.toast.showToast === 'function') {
          toast.showToast('Descarregant JSON...');
        }
      }
    }

    function esborrarAction() {
      // Obtener GUIDs de las preguntas seleccionadas
      const selectedCards = Array.from(document.querySelectorAll('.pregunta-card.selected'));
      let guidsSeleccionados = [];
      
      if (selectedCards.length > 0) {
        guidsSeleccionados = selectedCards.map(card => card.dataset.guid).filter(Boolean);
      }

      const total = historialFallos.length;
      const numSeleccionadas = guidsSeleccionados.length > 0 ? guidsSeleccionados.length : total;

      if (numSeleccionadas > 0) {
        if (confirm(`Segur que vols ⚠️ esborrar ${numSeleccionadas} de ${total} ⚠️ l'historial de fallos? Aquesta acció no es pot desfer.`)) {
          if (guidsSeleccionados.length > 0 && guidsSeleccionados.length < total) {
            // Borrar solo las seleccionadas: conservar las que NO están en guidsSeleccionados
            historialFallos = historialFallos.filter(p => !guidsSeleccionados.includes(p.guid));
          } else {
            // Borrar todo
            historialFallos = [];
          }
          guardarHistorial();
          actualizarUI();
          if (window.toast && typeof window.toast.showToast === 'function') {
            toast.showToast(`✅ S'han esborrat ${numSeleccionadas} pregunta${numSeleccionadas > 1 ? 'es' : ''}`);
          }
          // Recargar la página tras borrar
          setTimeout(() => { window.location.reload(); }, 600);
        }
      }
    }

    // Cargar historial al iniciar
    cargarHistorial();
  </script>
</body>
</html>
