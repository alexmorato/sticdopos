  <meta charset="UTF-8">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0b1020;
      padding-top: 20px;
    }

    #slidesContainer {
      --side-padding: max(0px, calc((100% - 1200px) / 2));
      padding: 0 var(--side-padding);
    }

    .slide {
      margin: 40px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .slide img {
      width: 100%;
      display: block;
      border-radius: 8px;
    }

    .slide iframe {
      width: 100%;
      display: block;
      border-radius: 8px;
      border: none;
      min-height: 600px;
    }

    .slide-content {
      width: 100%;
      min-height: 600px;
      background: #fff;
      color: #172033;
      border-radius: 8px;
      overflow: hidden;
    }

    .markdown-slide {
      padding: 32px;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .markdown-slide h1,
    .markdown-slide h2,
    .markdown-slide h3,
    .markdown-slide h4 {
      color: #12355b;
      line-height: 1.25;
      margin: 1.1em 0 0.55em;
    }

    .markdown-slide h1:first-child,
    .markdown-slide h2:first-child {
      margin-top: 0;
    }

    .markdown-slide p,
    .markdown-slide ul,
    .markdown-slide ol,
    .markdown-slide blockquote,
    .markdown-slide pre,
    .markdown-slide table {
      margin: 0 0 1em;
    }

    .markdown-slide ul,
    .markdown-slide ol {
      padding-left: 1.5em;
    }

    .markdown-slide blockquote {
      padding: 0.8em 1em;
      border-left: 5px solid #2878bd;
      background: #e9f5ff;
    }

    .markdown-slide pre {
      overflow-x: auto;
      padding: 1em;
      border-radius: 6px;
      background: #101828;
      color: #f8fafc;
    }

    .markdown-slide code {
      padding: 0.1em 0.3em;
      border-radius: 4px;
      background: #eef2f6;
    }

    .markdown-slide pre code {
      padding: 0;
      background: transparent;
    }

    .markdown-slide table {
      width: 100%;
      border-collapse: collapse;
    }

    .markdown-slide th,
    .markdown-slide td {
      padding: 0.65em;
      border: 1px solid #cad3df;
      text-align: left;
      vertical-align: top;
    }

    .markdown-slide th {
      background: #dfeefd;
    }

    .markdown-slide img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .tts-slide {
      padding: 24px;
    }

    .tts-toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 14px;
      background: #fff;
    }

    .tts-toolbar button {
      padding: 10px 14px;
      border: 0;
      border-radius: 7px;
      background: #12355b;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .tts-toolbar button:hover {
      background: #2878bd;
    }

    .tts-toolbar button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .tts-toolbar button.tts-stop {
      background: #b42318;
    }

    .tts-text {
      white-space: pre-wrap;
      padding: 20px;
      border: 1px solid #d5dfeb;
      border-radius: 8px;
      background: #f8fbff;
      color: #172033;
      font: 1.05rem/1.7 system-ui, sans-serif;
    }

    .slide-error,
    .slide-loading {
      padding: 40px;
      color: #667085;
      text-align: center;
    }

    .slide-error {
      color: #b42318;
    }

    /* Botón hamburguesa */
    .menu-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: #2aebad;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 1000;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(42, 235, 173, 0.3);
    }

    .menu-btn:hover {
      background: #21c08d;
      transform: scale(1.05);
    }

    .menu-btn span {
      width: 28px;
      height: 3px;
      background: #032217;
      border-radius: 2px;
      transition: all 0.3s;
    }

    /* Menú desplegable */
    .menu-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #141a2a;
      border: 2px solid #27304a;
      border-radius: 12px;
      padding: 15px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 1001;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      min-width: 180px;
    }

    .menu-panel.visible {
      display: flex;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .menu-close-btn {
      width: 100%;
      padding: 12px;
      background: #2aebad;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
      color: #032217;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .menu-close-btn:hover {
      background: #21c08d;
      transform: translateY(-1px);
    }

    .btn-fullscreen {
      width: 100%;
      padding: 12px;
      background: #2a5f8a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #e7ecff;
      transition: all 0.2s;
    }

    .btn-fullscreen:hover {
      background: #3a7faa;
      transform: translateY(-1px);
    }

    .btn-tornar {
      width: 100%;
      padding: 12px;
      background: #27304a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #e7ecff;
      transition: all 0.2s;
    }

    .btn-tornar:hover {
      background: #3a4a6a;
      transform: translateY(-1px);
    }

    .padding-controls {
      display: flex;
      gap: 10px;
    }

    .padding-controls button {
      width: 50%;
      height: 44px;
      padding: 0;
      font-size: 1.5rem;
    }

    .padding-controls button:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
    }

    .btn-pausar-diapos {
      width: 100%;
      padding: 12px;
      background: #e63946;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      transition: all 0.2s;
    }

    .btn-pausar-diapos:hover {
      background: #ff5566;
      transform: translateY(-1px);
    }

    /* Indicador de continuar */
    .continue-indicator {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #e63946;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.4);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .continue-indicator::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid #e63946;
    }

    .continue-indicator .fecha {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    /* Label del directorio */
    .info-label {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 999;
      background: #27304a;
      color: #e7ecff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      opacity: 0.9;
      cursor: pointer;
    }

    /* Contador de diapositivas */
    .slide-counter {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #2aebad;
      color: #032217;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(42, 235, 173, 0.4);
      z-index: 10;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .menu-btn {
        width: 45px;
        height: 45px;
        top: 15px;
        right: 15px;
      }

      .menu-btn span {
        width: 24px;
      }

      .menu-panel {
        top: 15px;
        right: 15px;
        min-width: 150px;
      }
    }
  </style>

  <script src="assets/js/localstorage-utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // Leer parámetros de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const root = urlParams.get('root') || 'apunts_new';
    const dir = urlParams.get('dir') || 'slides';
    const tema = urlParams.get('tema') || '';
    const imgsParam = urlParams.get('imgs') || '';

    // Parsear lista de imágenes
    const imgs = imgsParam.split(',').filter(img => img.trim() !== '');

    // Restaurar padding desde localStorage
    let lateralPadding = parseFloat(localStorage.getItem(LS_KEYS.DIAPOS_PADDING)) || 2;
    document.getElementById('slidesContainer').style.setProperty('--side-padding', `${lateralPadding}%`);

    // Verificar si hay datos de continuar diapos
    const continueDiapos = localStorage.getItem(LS_KEYS.DIAPOS_CONTINUE);
    let slideInicioContinuar = null;
    let fechaPausado = null;
    if (continueDiapos === 'true') {
      const datosGuardados = localStorage.getItem(LS_KEYS.DIAPOS_PAUSADO);
      if (datosGuardados) {
        const datos = JSON.parse(datosGuardados);
        slideInicioContinuar = datos.slideIndex;
        fechaPausado = datos.fechaPausado;
      }
      // Limpiar flag de continuar
      localStorage.removeItem(LS_KEYS.DIAPOS_CONTINUE);
    }

    // Generar dinámicamente los slides
    const container = document.getElementById('slidesContainer');
    
    if (imgs.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">No hi ha imatges disponibles</div>';
    } else {
      imgs.forEach((img, index) => {
        const slideDiv = document.createElement('div');
        slideDiv.className = 'slide';
        slideDiv.style.position = 'relative';
        slideDiv.dataset.index = index;
        
        // Si es la diapositiva donde se pausó, añadir indicador
        if (slideInicioContinuar !== null && index === slideInicioContinuar) {
          const indicatorDiv = document.createElement('div');
          indicatorDiv.className = 'continue-indicator';
          indicatorDiv.innerHTML = `
            <span>▼ Continuar diapos</span>
            <span class="fecha">${fechaPausado ? new Date(fechaPausado).toLocaleDateString('ca-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''}</span>
          `;
          slideDiv.appendChild(indicatorDiv);
        }
        
        // Contador de diapositiva (1 de N)
        const counterDiv = document.createElement('div');
        counterDiv.className = 'slide-counter';
        counterDiv.textContent = `${index + 1} de ${imgs.length}`;
        makeDismissible(counterDiv);
        
        // Determinar el tipus de recurs.
        const fileName = img.trim();
        const extension = fileName.toLowerCase().split('.').pop();
        const resourceUrl = `${root}/${tema}/${dir}/${fileName}`;
        
        if (extension === 'html') {
          // Crear iframe para HTML
          const iframeElement = document.createElement('iframe');
          iframeElement.src = resourceUrl;
          iframeElement.title = `Diapositiva ${index + 1}`;
          iframeElement.sandbox.add('allow-same-origin', 'allow-scripts', 'allow-forms');
          
          slideDiv.appendChild(counterDiv);
          slideDiv.appendChild(iframeElement);
        } else if (extension === 'md') {
          slideDiv.appendChild(counterDiv);
          renderMarkdownSlide(slideDiv, resourceUrl);
        } else if (extension === 'tts') {
          slideDiv.appendChild(counterDiv);
          renderTtsSlide(slideDiv, resourceUrl, fileName);
        } else {
          // Crear img para imágenes
          const imgElement = document.createElement('img');
          imgElement.src = resourceUrl;
          imgElement.alt = `Diapositiva ${index + 1}`;
          imgElement.loading = 'lazy';
          
          slideDiv.appendChild(counterDiv);
          slideDiv.appendChild(imgElement);
        }
        
        container.appendChild(slideDiv);
      });

      // Si hay continuar, hacer scroll a la diapositiva
      if (slideInicioContinuar !== null) {
        setTimeout(() => {
          const targetSlide = container.querySelector(`[data-index="${slideInicioContinuar}"]`);
          if (targetSlide) {
            targetSlide.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 300);
      }
    }

    function getSafeResourceUrl(url) {
      const resolved = new URL(url, window.location.href);
      return resolved.href;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function fallbackMarkdownParser(markdown) {
      const escaped = escapeHtml(markdown);
      const lines = escaped.split(/\r?\n/);
      let html = '';
      let listType = null;

      const closeList = () => {
        if (listType) {
          html += `</${listType}>`;
          listType = null;
        }
      };

      lines.forEach(line => {
        const unordered = line.match(/^\s*[-*+]\s+(.*)$/);
        const ordered = line.match(/^\s*\d+\.\s+(.*)$/);
        const heading = line.match(/^(#{1,6})\s+(.*)$/);

        if (heading) {
          closeList();
          html += `<h${heading[1].length}>${heading[2]}</h${heading[1].length}>`;
        } else if (unordered || ordered) {
          const nextType = unordered ? 'ul' : 'ol';
          if (listType !== nextType) {
            closeList();
            listType = nextType;
            html += `<${listType}>`;
          }
          html += `<li>${(unordered || ordered)[1]}</li>`;
        } else if (line.trim() === '') {
          closeList();
        } else {
          closeList();
          html += `<p>${line}</p>`;
        }
      });

      closeList();
      return html;
    }

    function sanitizeMarkdownHtml(html, resourceUrl) {
      const parsedDocument = new DOMParser().parseFromString(html, 'text/html');
      const wrapper = parsedDocument.body;

      wrapper.querySelectorAll('script, iframe, object, embed, form, style').forEach(node => node.remove());
      wrapper.querySelectorAll('*').forEach(element => {
        Array.from(element.attributes).forEach(attribute => {
          const name = attribute.name.toLowerCase();
          const value = attribute.value.trim();
          if (name.startsWith('on') || (name === 'style' && /url\s*\(/i.test(value))) {
            element.removeAttribute(attribute.name);
          }
        });
      });

      const baseUrl = new URL(resourceUrl, window.location.href);
      wrapper.querySelectorAll('img[src]').forEach(image => {
        const src = image.getAttribute('src');
        if (src && !/^(?:[a-z]+:|\/\/|#)/i.test(src)) {
          image.src = new URL(src, baseUrl).href;
        }
      });
      wrapper.querySelectorAll('a[href]').forEach(link => {
        const href = link.getAttribute('href');
        if (/^(?:javascript|data|vbscript):/i.test(href)) {
          link.removeAttribute('href');
          return;
        }
        if (href && !/^(?:[a-z]+:|\/\/|#)/i.test(href)) {
          link.href = new URL(href, baseUrl).href;
        }
        if (/^https?:/i.test(link.href)) {
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        }
      });

      return wrapper.innerHTML;
    }

    async function renderMarkdownSlide(slide, resourceUrl) {
      const content = document.createElement('article');
      content.className = 'slide-content markdown-slide';
      content.innerHTML = '<div class="slide-loading">Carregant Markdown...</div>';
      slide.appendChild(content);

      try {
        const response = await fetch(resourceUrl);
        if (!response.ok) {
          throw new Error(`No s'ha pogut carregar el fitxer (${response.status}).`);
        }

        const markdown = await response.text();
        const html = window.marked
          ? window.marked.parse(markdown, { gfm: true, breaks: false })
          : fallbackMarkdownParser(markdown);
        content.innerHTML = sanitizeMarkdownHtml(html, getSafeResourceUrl(resourceUrl));
      } catch (error) {
        content.innerHTML = `<div class="slide-error">Error carregant Markdown.<br>${escapeHtml(error.message)}</div>`;
      }
    }

    function splitSpeechText(text) {
      const paragraphs = text.split(/\n\s*\n/).map(part => part.trim()).filter(Boolean);
      const chunks = [];

      paragraphs.forEach(paragraph => {
        if (paragraph.length <= 700) {
          chunks.push(paragraph);
          return;
        }
        const sentences = paragraph.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [paragraph];
        let buffer = '';
        sentences.forEach(sentence => {
          if ((buffer + ' ' + sentence).trim().length > 700 && buffer) {
            chunks.push(buffer.trim());
            buffer = sentence.trim();
          } else {
            buffer = (buffer + ' ' + sentence).trim();
          }
        });
        if (buffer) chunks.push(buffer);
      });

      return chunks;
    }

    async function renderTtsSlide(slide, resourceUrl, fileName) {
      const content = document.createElement('section');
      content.className = 'slide-content tts-slide';
      content.innerHTML = '<div class="slide-loading">Carregant text per a veu...</div>';
      slide.appendChild(content);

      try {
        const response = await fetch(resourceUrl);
        if (!response.ok) {
          throw new Error(`No s'ha pogut carregar el fitxer (${response.status}).`);
        }

        const text = await response.text();
        const controlsId = `tts-controls-${slide.dataset.index}`;
        const textId = `tts-text-${slide.dataset.index}`;
        content.innerHTML = `
          <div class="tts-toolbar" id="${controlsId}">
            <button type="button" class="tts-play">🔊 Reproduir</button>
            <button type="button" class="tts-pause" disabled>Pausar</button>
            <button type="button" class="tts-stop" disabled>Aturar</button>
          </div>
          <div class="tts-text" id="${textId}">${escapeHtml(text)}</div>
        `;

        configureSpeechControls(content, text, fileName);
      } catch (error) {
        content.innerHTML = `<div class="slide-error">Error carregant el TTS.<br>${escapeHtml(error.message)}</div>`;
      }
    }

    function configureSpeechControls(content, text, fileName) {
      const playButton = content.querySelector('.tts-play');
      const pauseButton = content.querySelector('.tts-pause');
      const stopButton = content.querySelector('.tts-stop');
      const chunks = splitSpeechText(text);
      let chunkIndex = 0;
      let active = false;

      if (!('speechSynthesis' in window) || chunks.length === 0) {
        playButton.disabled = true;
        playButton.textContent = chunks.length === 0 ? 'Text buit' : 'Veu no disponible';
        return;
      }

      const selectCatalanVoice = () => {
        const voices = window.speechSynthesis.getVoices();
        return voices.find(voice => /^ca(?:[-_]|$)/i.test(voice.lang))
          || voices.find(voice => /^es(?:[-_]|$)/i.test(voice.lang))
          || null;
      };

      const updateButtons = () => {
        playButton.disabled = active && !window.speechSynthesis.paused;
        pauseButton.disabled = !active;
        stopButton.disabled = !active;
        pauseButton.textContent = window.speechSynthesis.paused ? 'Reprendre' : 'Pausar';
      };

      const finish = () => {
        active = false;
        chunkIndex = 0;
        updateButtons();
      };

      const speakNext = () => {
        if (!active || chunkIndex >= chunks.length) {
          finish();
          return;
        }

        const utterance = new SpeechSynthesisUtterance(chunks[chunkIndex]);
        const voice = selectCatalanVoice();
        utterance.lang = voice ? voice.lang : 'ca-ES';
        if (voice) utterance.voice = voice;
        utterance.rate = 0.95;
        utterance.pitch = 1;
        utterance.onend = () => {
          chunkIndex += 1;
          speakNext();
        };
        utterance.onerror = event => {
          if (event.error !== 'canceled' && event.error !== 'interrupted') {
            console.error(`Error de veu a ${fileName}:`, event);
          }
          finish();
        };
        window.speechSynthesis.speak(utterance);
      };

      playButton.addEventListener('click', () => {
        window.speechSynthesis.cancel();
        active = true;
        chunkIndex = 0;
        speakNext();
        updateButtons();
      });

      pauseButton.addEventListener('click', () => {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        } else {
          window.speechSynthesis.pause();
        }
        updateButtons();
      });

      stopButton.addEventListener('click', () => {
        active = false;
        window.speechSynthesis.cancel();
        finish();
      });

      window.addEventListener('beforeunload', () => window.speechSynthesis.cancel(), { once: true });
      updateButtons();
    }

    // Actualizar label con el nombre del directorio
    const infoLabel = document.getElementById('infoLabel');
    infoLabel.textContent = dir || 'slides';
    makeDismissible(infoLabel);

    function makeDismissible(element) {
      element.setAttribute('role', 'button');
      element.tabIndex = 0;
      element.title = 'Clica per amagar';

      const dismiss = () => element.remove();
      element.addEventListener('click', dismiss);
      element.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          dismiss();
        }
      });
    }

    // Referencias a elementos del menú
    const menuBtn = document.getElementById('menuBtn');
    const menuPanel = document.getElementById('menuPanel');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const tornarBtn = document.getElementById('tornarBtn');
    const menuIndexBtn = document.getElementById('menuIndexBtn');
    const pausarDiaposBtn = document.getElementById('pausarDiaposBtn');

    const decreasePaddingBtn = document.getElementById('decreasePaddingBtn');
    const increasePaddingBtn = document.getElementById('increasePaddingBtn');

    // Actualizar estado de botones
    function updatePaddingButtons() {
      decreasePaddingBtn.disabled = lateralPadding === 0;
      increasePaddingBtn.disabled = lateralPadding === 40;
    }

    function adjustPadding(change) {
      lateralPadding = Math.min(40, Math.max(0, lateralPadding + change));
      container.style.setProperty('--side-padding', `${lateralPadding}%`);
      // Guardar en localStorage
      localStorage.setItem(LS_KEYS.DIAPOS_PADDING, lateralPadding.toString());
      updatePaddingButtons();
    }

    // Inicializar estado de botones
    updatePaddingButtons();

    decreasePaddingBtn.addEventListener('click', () => adjustPadding(-2));
    increasePaddingBtn.addEventListener('click', () => adjustPadding(2));

    // Función para obtener la diapositiva más visible
    function getVisibleSlideIndex() {
      const slides = container.querySelectorAll('.slide');
      let maxVisibleIndex = 0;
      let maxVisibleArea = 0;

      slides.forEach((slide, index) => {
        const rect = slide.getBoundingClientRect();
        const viewportHeight = window.innerHeight;
        
        // Calcular cuánto del slide es visible
        const visibleTop = Math.max(0, rect.top);
        const visibleBottom = Math.min(viewportHeight, rect.bottom);
        const visibleArea = Math.max(0, visibleBottom - visibleTop);
        
        if (visibleArea > maxVisibleArea) {
          maxVisibleArea = visibleArea;
          maxVisibleIndex = index;
        }
      });

      return maxVisibleIndex;
    }

    // Toggle menú
    menuBtn.addEventListener('click', () => {
      menuPanel.classList.toggle('visible');
    });

    // Cerrar menú
    menuCloseBtn.addEventListener('click', () => {
      menuPanel.classList.remove('visible');
    });

    // Cerrar menú al hacer clic fuera
    document.addEventListener('click', (e) => {
      if (!menuPanel.contains(e.target) && !menuBtn.contains(e.target)) {
        menuPanel.classList.remove('visible');
      }
    });

    // Botón fullscreen
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          fullscreenBtn.innerHTML = '⛶ Sortir pantalla completa';
          menuPanel.classList.remove('visible');
        }).catch(err => {
          console.error('Error al activar fullscreen:', err);
        });
      } else {
        document.exitFullscreen().then(() => {
          fullscreenBtn.innerHTML = '⛶ Pantalla completa';
          menuPanel.classList.remove('visible');
        });
      }
    });

    // Actualizar texto del botón cuando se sale de fullscreen con ESC
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fullscreenBtn.innerHTML = '⛶ Pantalla completa';
      }
    });

    // Botón tornar
    tornarBtn.addEventListener('click', () => {
      tiraPaAtras();
    });

    // Capturar tecla Backspace para volver atrás
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace') {
        // Prevenir el comportamiento por defecto solo si no estamos en un input
        if (document.activeElement.tagName !== 'INPUT' && 
            document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          tiraPaAtras();
        }
      }
    });

    function tiraPaAtras() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    // Botón menu principal
    menuIndexBtn.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // Botón pausar diapos
    pausarDiaposBtn.addEventListener('click', () => {
      const slideIndex = getVisibleSlideIndex();
      
      // Guardar datos en localStorage
      const datosDiapos = {
        root: root,
        dir: dir,
        tema: tema,
        imgs: imgsParam,
        slideIndex: slideIndex,
        slideNumber: slideIndex + 1,
        totalSlides: imgs.length,
        fechaPausado: new Date().toISOString(),
        urlCompleta: window.location.href
      };
      localStorage.setItem(LS_KEYS.DIAPOS_PAUSADO, JSON.stringify(datosDiapos));
      
      // Cerrar menú y mostrar confirmación
      menuPanel.classList.remove('visible');
      alert(`Diapos pausades a la ${slideIndex + 1} de ${imgs.length}. Pots continuar des del menú principal.`);
      window.location.href = 'index.html?highlight=diapos';
    });

  </script>

</body>
</html>
